<style>
:root{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#12141c;color:#e8ebf2;min-height:100vh;padding:24px 32px}
.wrap{max-width:1400px;margin:0 auto}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.nav a,.nav button{text-decoration:none;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;border:1.5px solid #2e3342;background:#1b1e28;color:#8a93a8;cursor:pointer}
.nav a.act{background:#6d4bf6;color:#fff;border-color:#6d4bf6}
h1{font-size:22px;margin-bottom:2px}
.sub{color:#8a93a8;font-size:13px;margin-bottom:16px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.pill{padding:7px 14px;border-radius:20px;border:1.5px solid #2e3342;background:#1b1e28;color:#c9d0de;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.act{background:#6d4bf6;color:#fff;border-color:#6d4bf6}
.pill.add{border-style:dashed;color:#8a93a8}
.pill .sh{font-size:10px;opacity:.8;margin-left:4px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;padding:11px 13px;border:1.5px solid #2e3342;border-radius:10px;background:#151824;color:#e8ebf2;font-size:14px;outline:none}
.btn{background:#6d4bf6;color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:#1b1e28;border:1.5px solid #2e3342;color:#c9d0de}
.dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;width:100%;background:#1b1e28;border:1.5px solid #2e3342;border-radius:12px;max-height:66vh;overflow:auto;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.drow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #2e3342}
.drow:last-child{border-bottom:none}
.drow img{width:42px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0}
.dr-noimg{width:42px;height:62px;background:#151824;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#3a4152}
.dr-info{flex:1;min-width:0}
.dr-t{font-size:14px;font-weight:700}
.dr-y{font-size:12px;color:#8a93a8}
.dr-add{background:#6d4bf6;color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dr-add.in{background:#25324a;color:#7fa8ff}
.dr-msg{padding:14px;text-align:center;color:#8a93a8;font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid #2e3342;background:#1b1e28;color:#8a93a8;font-size:12px;font-weight:600;cursor:pointer}
.chip.act{background:#2e3342;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
@media(min-width:1100px){#items.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.card{background:#1b1e28;border:1.5px solid #2e3342;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#151824;display:block}
.card .noimg{width:100%;aspect-ratio:2/3;background:#151824;display:flex;align-items:center;justify-content:center;font-size:34px;color:#3a4152}
.cb{padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}
.tt{font-size:15px;font-weight:700;line-height:1.25}
.yr{font-size:12px;color:#8a93a8}
.cmt{width:100%;background:#151824;border:1.5px solid #2e3342;color:#e8ebf2;border-radius:8px;padding:7px;font-size:12px;font-family:inherit;resize:vertical;min-height:34px;outline:none}
.cmt:focus{border-color:#6d4bf6}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.rankbadge{position:absolute;top:8px;right:8px;background:#6d4bf6;color:#fff;font-size:16px;font-weight:800;padding:3px 10px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.st{position:absolute;bottom:8px;left:8px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.st.quero{background:#3a4152;color:#c9d0de}.st.backlog{background:#7a5b1e;color:#ffd98a}
.st.assistindo{background:#1e5b7a;color:#8fd4ff}.st.assistido{background:#1e7a4d;color:#8affc0}
.cardwrap{position:relative;display:flex;flex-direction:column}
.rowb{display:flex;gap:6px;align-items:center}
select,.note{background:#151824;border:1.5px solid #2e3342;color:#e8ebf2;border-radius:8px;padding:6px;font-size:12px}
select{flex:1}
.note{width:52px;text-align:center}
.mini{background:none;border:none;color:#8a93a8;font-size:11px;cursor:pointer;padding:2px}
.mini:hover{color:#f07567}
.prov{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;align-items:center}
.prov img{width:42px;height:42px;border-radius:9px;aspect-ratio:1}
.prov .lbl{font-size:12px;font-weight:600;color:#aab3c5;width:100%;margin-top:2px}
.add-btn{background:#6d4bf6;color:#fff;border:none;border-radius:8px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:auto}
.add-btn.in{background:#25324a;color:#7fa8ff}
.sec-title{font-size:13px;font-weight:700;color:#8a93a8;margin:18px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.empty{color:#57617a;font-size:14px;padding:30px;text-align:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.stat{background:#1b1e28;border:1.5px solid #2e3342;border-radius:14px;padding:14px;text-align:center}
.stat .sv{font-size:24px;font-weight:800;color:#6d4bf6}
.stat .sl{font-size:12px;color:#8a93a8;margin-top:2px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr}}
.chartcard{background:#1b1e28;border:1.5px solid #2e3342;border-radius:14px;padding:14px}
.chartcard .ch-t{font-size:13px;font-weight:700;color:#8a93a8;margin-bottom:8px;text-align:center}
.chartcard canvas{max-height:200px}
/* login */
#ov{position:fixed;inset:0;z-index:99;background:#12141c;display:flex;align-items:center;justify-content:center}
#ovbox{background:#1b1e28;border:1px solid #2e3342;border-radius:16px;padding:28px;width:340px;max-width:92vw}
#ovbox input{width:100%;padding:11px;margin-bottom:12px;border:1.5px solid #2e3342;border-radius:9px;background:#151824;color:#e8ebf2;font-size:14px;outline:none}
#ovbox button{width:100%;padding:11px;border:none;border-radius:9px;background:#6d4bf6;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
#ovmsg{font-size:12px;margin-top:12px;min-height:16px;color:#f07567}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modalbox{background:#1b1e28;border:1px solid #2e3342;border-radius:16px;padding:24px;width:380px;max-width:94vw}
#modalbox h3{font-size:16px;margin-bottom:14px}
#modalbox input,#modalbox select{width:100%;padding:10px;margin-bottom:12px;border:1.5px solid #2e3342;border-radius:9px;background:#151824;color:#e8ebf2;font-size:14px}
#modalbox label{font-size:12px;color:#8a93a8;display:block;margin-bottom:4px}
</style>
</head>
<body>

<div id="ov"><div id="ovbox">
  <div id="ovload" style="text-align:center;color:#8a93a8;font-size:14px">Carregando…</div>
  <div id="ovform" style="display:none">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">🔒 Entrar</div>
    <div style="font-size:13px;color:#8a93a8;margin-bottom:18px">Acesse seus filmes e séries.</div>
    <div id="s1"><input id="em" type="email" placeholder="Seu e-mail"><button onclick="sendCode()">Enviar código</button></div>
    <div id="s2" style="display:none"><input id="cd" inputmode="numeric" maxlength="10" placeholder="código" style="text-align:center;letter-spacing:5px;font-size:20px"><button onclick="verify()">Confirmar e entrar</button><button onclick="reset2()" style="background:none;color:#8a93a8;font-weight:600;font-size:12px;margin-top:8px">Trocar e-mail</button></div>
    <div id="ovmsg"></div>
  </div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="nav">
    <span id="navLinks" style="display:contents"><a href="index.html">🏠 Início</a></span>
    <button onclick="logout()" style="margin-left:auto">Sair</button>
  </div>
  <h1>🎬 Filmes & Séries</h1>
  <div class="sub" id="sub">Suas listas.</div>

  <div class="pills" id="pills"></div>
  <div id="shareRow" style="margin-bottom:14px;display:none"></div>
  <div id="statsBox"></div>

  <div class="bar" style="position:relative">
    <input id="q" placeholder="Buscar filme ou série… (ex: Interestelar)" oninput="debSearch()" autocomplete="off">
    <button class="btn ghost" onclick="clearSearch()">Limpar</button>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="filters" id="filters" style="display:none">
    <span class="chip act" data-f="todos" onclick="setFilter('todos')">Todos</span>
    <span class="chip" data-f="quero" onclick="setFilter('quero')">Quero ver</span>
    <span class="chip" data-f="backlog" onclick="setFilter('backlog')">Backlog</span>
    <span class="chip" data-f="assistindo" onclick="setFilter('assistindo')">Assistindo</span>
    <span class="chip" data-f="assistido" onclick="setFilter('assistido')">Assistido</span>
    <span class="chip" data-f="ranking" onclick="setFilter('ranking')" style="margin-left:auto">🏆 Ranking</span>
  </div>
  <div class="sec-title" id="listTitle" style="display:none">📁 Minha lista</div>
  <div class="grid" id="items"></div>

  <div id="results"></div>
</div>

<div id="modal"><div id="modalbox"></div></div>

<script>
const SB_URL="https://ovpncggowjhualakjaug.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cG5jZ2dvd2podWFsYWtqYXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDI1MDIsImV4cCI6MjEwMDMxODUwMn0.yGWi4aWynDVhIEftBZcayGrbPxgqj93ckDua0zTr4zI";
const TMDB="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxYjdlNTdjZmIxNmVmY2Y2NWQzODFjODhhODEyNTdiYSIsIm5iZiI6MTc4NDkxMTU5NS45OSwic3ViIjoiNmE2Mzk2ZWI5MDkyZGQ2MjRjM2Y1YTk2Iiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.4oNFG5jVeLBj-PIkxpNFSf8ZgJYZjBpwSknRWyBfl9A";
const IMG="https://image.tmdb.org/t/p/w300";
const LOGO="https://image.tmdb.org/t/p/w92";
const sb=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
async function tmdb(path){ const r=await fetch("https://api.themoviedb.org/3"+path,{headers:{Authorization:"Bearer "+TMDB}}); return r.json(); }
const GEN_MOVIE={28:"Ação",12:"Aventura",16:"Animação",35:"Comédia",80:"Crime",99:"Documentário",18:"Drama",10751:"Família",14:"Fantasia",36:"História",27:"Terror",10402:"Música",9648:"Mistério",10749:"Romance",878:"Ficção científica",10770:"Cinema TV",53:"Thriller",10752:"Guerra",37:"Faroeste"};
const GEN_TV={10759:"Ação & Aventura",16:"Animação",35:"Comédia",80:"Crime",99:"Documentário",18:"Drama",10751:"Família",10762:"Infantil",9648:"Mistério",10763:"Notícias",10764:"Reality",10765:"Sci-Fi & Fantasia",10766:"Novela",10767:"Talk",10768:"Guerra & Política",37:"Faroeste"};
function genreName(ids,media){ const map=(media==="tv")?GEN_TV:GEN_MOVIE; if(!ids||!ids.length) return ""; return map[ids[0]]||""; }

let ME=null, COLS=[], ACTIVE=null, ITEMS=[], FILTER="todos";
const provCache={};

// ---------- login ----------
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) onLogin(); else showForm();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s && document.getElementById("ov").style.display!=="none") onLogin(); });
}
function showForm(){ document.getElementById("ovload").style.display="none"; document.getElementById("ovform").style.display="block"; }
function amsg(t,ok){ const e=document.getElementById("ovmsg"); e.textContent=t; e.style.color=ok?"#3ecf9a":"#f07567"; }
async function sendCode(){
  const email=document.getElementById("em").value.trim(); if(!email){amsg("Digite seu e-mail.");return;}
  amsg("Enviando…",true);
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  if(error){amsg(error.message);return;}
  document.getElementById("s1").style.display="none"; document.getElementById("s2").style.display="block"; amsg("Código enviado!",true);
}
async function verify(){
  const email=document.getElementById("em").value.trim(), token=document.getElementById("cd").value.trim();
  if(token.length<4){amsg("Digite o código.");return;}
  amsg("Verificando…",true);
  const {error}=await sb.auth.verifyOtp({email,token,type:"email"});
  if(error) amsg(error.message);
}
function reset2(){ document.getElementById("s2").style.display="none"; document.getElementById("s1").style.display="block"; amsg(""); }
async function logout(){ await sb.auth.signOut(); location.reload(); }

// ---------- boot ----------
async function onLogin(){
  document.getElementById("ov").style.display="none";
  document.getElementById("app").style.display="block";
  const {data:{user}}=await sb.auth.getUser(); ME=user;
  buildNav(sb,"filmes");
  try{ await sb.rpc("claim_invites"); }catch(e){ console.warn("claim",e); }
  await loadCols();
}

async function loadCols(){
  const {data,error}=await sb.from("collections").select("*").eq("kind","filmes").order("created_at");
  if(error){ console.warn(error); }
  COLS=data||[];
  if(!COLS.length){
    // cria a lista pessoal padrão na primeira vez
    await sb.from("collections").insert({kind:"filmes",name:"Minha lista",is_shared:false});
    const {data:d2}=await sb.from("collections").select("*").eq("kind","filmes").order("created_at");
    COLS=d2||[];
  }
  if(!ACTIVE || !COLS.find(c=>c.id===ACTIVE)) ACTIVE=COLS[0]?.id;
  renderPills();
  await loadItems();
  showReleases();
}

function renderPills(){
  let h="";
  COLS.forEach(c=>{
    h+=`<div class="pill ${c.id===ACTIVE?'act':''}" onclick="selCol('${c.id}')">${esc(c.name)}${c.is_shared?'<span class="sh">👥</span>':''}</div>`;
  });
  h+=`<div class="pill add" onclick="newColModal()">+ Nova lista</div>`;
  document.getElementById("pills").innerHTML=h;
}
async function selCol(id){ ACTIVE=id; renderPills(); await loadItems(); }

async function loadItems(){
  if(!ACTIVE){ document.getElementById("items").innerHTML=""; return; }
  const {data}=await sb.from("items").select("*").eq("collection_id",ACTIVE).order("created_at",{ascending:false});
  ITEMS=data||[];
  document.getElementById("filters").style.display=ITEMS.length?"flex":"none";
  const c=COLS.find(x=>x.id===ACTIVE);
  const lt=document.getElementById("listTitle");
  lt.style.display=ITEMS.length?"block":"none";
  lt.textContent="📁 "+(c?c.name:"Minha lista")+" — "+ITEMS.length+" título"+(ITEMS.length===1?"":"s");
  renderShareRow();
  renderStats();
  renderItems();
}

// ---------- estatísticas ----------
let CHARTS={};
function renderStats(){
  const box=document.getElementById("statsBox"); if(!box) return;
  if(!ITEMS.length){ box.innerHTML=""; Object.values(CHARTS).forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS={}; return; }
  const vistos=ITEMS.filter(i=>i.status==="assistido");
  const favs=ITEMS.filter(i=>i.rating!=null && i.rating>=9).length;
  const ano=new Date().getFullYear();
  const esteAno=vistos.filter(i=>(i.done_date||"").slice(0,4)==String(ano)).length;
  const gen={}; ITEMS.forEach(i=>{ const g=((i.meta&&i.meta.genre)||"").trim()||"Outros"; gen[g]=(gen[g]||0)+1; });
  const filmes=ITEMS.filter(i=>i.kind!=="serie").length, series=ITEMS.length-filmes;
  const topN=(o,n)=>{ const ks=Object.keys(o).sort((a,b)=>o[b]-o[a]); const t=ks.slice(0,n); const rest=ks.slice(n).reduce((s,x)=>s+o[x],0); const labels=t.slice(),data=t.map(x=>o[x]); if(rest){labels.push("Outros");data.push(rest);} return {labels,data}; };
  const G=topN(gen,7);
  box.innerHTML=`
    <div class="stats-grid">
      <div class="stat"><div class="sv">${vistos.length}</div><div class="sl">🎬 Assistidos</div></div>
      <div class="stat"><div class="sv">${ITEMS.length}</div><div class="sl">📺 Na lista</div></div>
      <div class="stat"><div class="sv">${favs}</div><div class="sl">⭐ Favoritos (nota ≥9)</div></div>
      <div class="stat"><div class="sv">${esteAno}</div><div class="sl">🗓️ Assistidos em ${ano}</div></div>
    </div>
    <div class="charts-grid">
      <div class="chartcard"><div class="ch-t">Gêneros</div><canvas id="chGen"></canvas></div>
      <div class="chartcard"><div class="ch-t">Assistido vs. a ver · Filmes vs. séries</div><canvas id="chStatus"></canvas></div>
    </div>
    <div class="chartcard" style="margin-bottom:16px"><div class="ch-t">📅 Assistidos por ano</div><canvas id="chYear" style="max-height:170px"></canvas></div>`;
  Object.values(CHARTS).forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS={};
  if(typeof Chart==="undefined") return;
  const pal=['#6d4bf6','#3ecf9a','#f59e0b','#f472b6','#38bdf8','#a855f7','#f07567','#94a0b8'];
  const dough=(id,labels,data,colors,onClick)=>new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,onClick:onClick,plugins:{legend:{position:'bottom',labels:{color:'#aab3c5',font:{size:11},boxWidth:12,padding:8}}},cutout:'55%'}});
  CHARTS.gen=dough('chGen',G.labels,G.data,pal,(e,el)=>{ if(!el.length)return; const l=G.labels[el[0].index]; FGEN=(FGEN===l)?"":l; FKIND=""; FILTER="todos"; document.querySelectorAll("#filters .chip").forEach(c=>c.classList.toggle("act",c.dataset.f==="todos")); renderItems(); });
  CHARTS.status=dough('chStatus',['Assistidos','A ver','Filmes','Séries'],[vistos.length,ITEMS.length-vistos.length,filmes,series],['#3ecf9a','#4d5566','#6d4bf6','#38bdf8'],(e,el)=>{ if(!el.length)return; const idx=el[0].index; if(idx===0){setFilter('assistido');} else if(idx===1){setFilter('todos');} else { FGEN=""; FKIND=(idx===3)?((FKIND==="serie")?"":"serie"):((FKIND==="filme")?"":"filme"); FILTER="todos"; renderItems(); } });
  const anosMap={}; vistos.forEach(i=>{ const y=(i.done_date||"").slice(0,4); if(y) anosMap[y]=(anosMap[y]||0)+1; });
  const years=Object.keys(anosMap).sort();
  CHARTS.year=new Chart(document.getElementById('chYear'),{type:'bar',data:{labels:years,datasets:[{data:years.map(y=>anosMap[y]),backgroundColor:'#6d4bf6'}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aab3c5',font:{size:11}}},y:{beginAtZero:true,ticks:{color:'#aab3c5',precision:0}}}}});
}

function renderShareRow(){
  const c=COLS.find(x=>x.id===ACTIVE); const row=document.getElementById("shareRow");
  if(!c || c.owner_id!==ME.id){ row.style.display="none"; return; }
  row.style.display="block";
  row.innerHTML=`<button class="btn ghost" onclick="shareModal()">👥 Compartilhar "${esc(c.name)}"</button>`;
}

let FGEN="", FKIND="";
function setFilter(f){ FILTER=f; FGEN=""; FKIND=""; document.querySelectorAll("#filters .chip").forEach(c=>c.classList.toggle("act",c.dataset.f===f)); renderItems(); }

const STLBL={quero:"Quero ver",backlog:"Backlog",assistindo:"Assistindo",assistido:"Assistido"};
function renderItems(){
  const box=document.getElementById("items");
  if(FILTER==="ranking"){
    const ranked=ITEMS.filter(i=>i.rating!=null).sort((a,b)=>b.rating-a.rating);
    if(!ranked.length){ box.innerHTML='<div class="empty">Dê notas aos filmes pra montar o ranking. 🏆</div>'; return; }
    box.innerHTML=ranked.map((i,idx)=>itemCard(i,idx+1)).join("");
    return;
  }
  let list = FILTER==="todos"?ITEMS:ITEMS.filter(i=>(i.status||"quero")===FILTER);
  if(FGEN) list=list.filter(i=>(((i.meta&&i.meta.genre)||"").trim()||"Outros")===FGEN);
  if(FKIND) list=list.filter(i=>(FKIND==="serie"?i.kind==="serie":i.kind!=="serie"));
  if(!list.length){ box.innerHTML='<div class="empty">Nenhum título com esses filtros. 🎬</div>'; return; }
  box.innerHTML=list.map(i=>itemCard(i)).join("");
}
function medal(n){ return n===1?"🥇":n===2?"🥈":n===3?"🥉":"#"+n; }

function itemCard(i,rank){
  const yr=(i.meta&&i.meta.year)||"";
  const poster=i.poster?`<img src="${i.poster}" loading="lazy">`:`<div class="noimg">🎬</div>`;
  const kindTag=i.kind==="serie"?"Série":"Filme";
  const st=i.status||"quero";
  const rankB=rank?`<span class="rankbadge">${medal(rank)}${i.rating!=null?' · '+i.rating:''}</span>`:"";
  return `<div class="card"><div class="cardwrap">
    ${poster}<span class="tag">${kindTag}</span>${rankB}<span class="st ${st}">${STLBL[st]||st}</span></div>
    <div class="cb">
      <div class="tt">${esc(i.title)}</div>
      <div class="yr">${yr}</div>
      <div class="rowb">
        <select onchange="setStatus('${i.id}',this.value)">
          <option value="quero" ${st==="quero"?"selected":""}>Quero ver</option>
          <option value="backlog" ${st==="backlog"?"selected":""}>Backlog</option>
          <option value="assistindo" ${st==="assistindo"?"selected":""}>Assistindo</option>
          <option value="assistido" ${st==="assistido"?"selected":""}>Assistido</option>
        </select>
        <input class="note" type="number" min="0" max="10" step="0.1" placeholder="—" value="${i.rating??""}" onchange="setRating('${i.id}',this.value)" title="Nota 0-10">
      </div>
      <textarea class="cmt" placeholder="Comentário…" onchange="setNote('${i.id}',this.value)">${esc(i.note||"")}</textarea>
      <div class="prov" id="prov-${i.id}"></div>
      <div class="rowb" style="justify-content:space-between">
        <button class="mini" onclick="showProv('${i.id}')">📺 Onde assistir</button>
        <button class="mini" onclick="delItem('${i.id}')">remover</button>
      </div>
    </div></div>`;
}

// ---------- busca TMDB ----------
let _t;
function debSearch(){ clearTimeout(_t); _t=setTimeout(doSearch,300); }
function dd(){ return document.getElementById("dropdown"); }
function hideDropdown(){ dd().style.display="none"; dd().innerHTML=""; }
// mostra/esconde a "casa" (lista + 50 melhores) durante a busca
function setSearchMode(on){
  document.getElementById("items").style.display   = on?"none":"grid";
  document.getElementById("results").style.display = on?"none":"block";
  document.getElementById("listTitle").style.display = (on||!ITEMS.length)?"none":"block";
  document.getElementById("filters").style.display   = (on||!ITEMS.length)?"none":"flex";
}
function restoreHome(){ document.getElementById("q").value=""; hideDropdown(); setSearchMode(false); }
function clearSearch(){ restoreHome(); }
function refreshResults(){ const q=document.getElementById("q").value.trim(); if(q.length>=2) doSearch(); }

async function showReleases(){
  const R=document.getElementById("results");
  // recomenda pelo gênero mais comum da sua lista (igual livros); se lista vazia, mostra os melhores de todos os tempos
  const gc={}; ITEMS.forEach(i=>{ const g=(i.meta&&i.meta.genre)||""; if(g) gc[g]=(gc[g]||0)+1; });
  const topGenre=Object.keys(gc).sort((a,b)=>gc[b]-gc[a])[0];
  const REV={}; Object.entries(GEN_MOVIE).forEach(([id,nm])=>{ REV[nm]=id; });
  const gid=topGenre?REV[topGenre]:null;
  const perso=!!gid;
  const titulo=perso?`✨ Recomendados — ${esc(topGenre)}`:"⭐ Melhores de todos os tempos";
  R.innerHTML=`<div class="sec-title">${titulo}</div><div class="empty">Carregando…</div>`;
  let all=[];
  for(let p=1;p<=3;p++){
    const path=perso ? `/discover/movie?with_genres=${gid}&sort_by=popularity.desc&vote_count.gte=200&language=pt-BR&page=${p}`
                     : `/movie/top_rated?language=pt-BR&region=BR&page=${p}`;
    const d=await tmdb(path);
    (d.results||[]).forEach(x=>{ x.media_type="movie"; });
    all=all.concat(d.results||[]);
  }
  const shelf=new Set(ITEMS.map(i=>String(i.ext_id)));
  const seen=new Set();
  all=all.filter(x=>{ if(seen.has(x.id)||shelf.has(String(x.id)))return false; seen.add(x.id); return true; });
  if(!perso) all.sort((a,b)=>(b.vote_average||0)-(a.vote_average||0));
  all=all.slice(0,50);
  if(!all.length){ R.innerHTML=""; return; }
  R.innerHTML=`<div class="sec-title">${titulo}</div><div class="grid">`+all.map(searchCard).join("")+'</div>';
}

async function doSearch(){
  const q=document.getElementById("q").value.trim();
  if(q.length<2){ restoreHome(); return; }
  setSearchMode(true);
  dd().style.display="block";
  dd().innerHTML='<div class="dr-msg">Buscando…</div>';
  const d=await tmdb(`/search/multi?query=${encodeURIComponent(q)}&language=pt-BR&page=1`);
  const res=(d.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").slice(0,20);
  if(document.getElementById("q").value.trim()!==q) return; // busca antiga
  if(!res.length){ dd().innerHTML='<div class="dr-msg">Nada encontrado.</div>'; return; }
  dd().innerHTML=res.map(dropRow).join("");
}
function dropRow(x){
  const title=x.title||x.name||"—";
  const date=x.release_date||x.first_air_date||"";
  const yr=date?date.slice(0,4):"";
  const kind=x.media_type==="tv"?"serie":"filme";
  const poster=x.poster_path?`<img src="${LOGO}${x.poster_path}" loading="lazy">`:`<div class="dr-noimg">🎬</div>`;
  const already=ITEMS.find(i=>String(i.ext_id)===String(x.id));
  const payload=encodeURIComponent(JSON.stringify({id:x.id,title,yr,kind,poster:x.poster_path?IMG+x.poster_path:"",media:x.media_type,vote:x.vote_average,genre:genreName(x.genre_ids,x.media_type)})).replace(/'/g,"%27");
  return `<div class="drow">${poster}
    <div class="dr-info"><div class="dr-t">${esc(title)}</div>
    <div class="dr-y">${yr} · ${kind==="serie"?"Série":"Filme"}${x.vote_average?" · ⭐"+x.vote_average.toFixed(1):""}</div></div>
    <button class="dr-add ${already?'in':''}" onclick="addItem('${payload}')">${already?"✓ Na lista":"+ Adicionar"}</button></div>`;
}
function searchCard(x){
  const title=x.title||x.name||"—";
  const date=x.release_date||x.first_air_date||"";
  const yr=date?date.slice(0,4):"";
  const poster=x.poster_path?`<img src="${IMG}${x.poster_path}" loading="lazy">`:`<div class="noimg">🎬</div>`;
  const kind=x.media_type==="tv"?"serie":"filme";
  const already=ITEMS.find(i=>String(i.ext_id)===String(x.id));
  const payload=encodeURIComponent(JSON.stringify({id:x.id,title,yr,kind,poster:x.poster_path?IMG+x.poster_path:"",media:x.media_type,vote:x.vote_average,genre:genreName(x.genre_ids,x.media_type)})).replace(/'/g,"%27");
  return `<div class="card"><div class="cardwrap">${poster}<span class="tag">${kind==="serie"?"Série":"Filme"}</span></div>
    <div class="cb"><div class="tt">${esc(title)}</div><div class="yr">${yr}${x.vote_average?" · ⭐"+x.vote_average.toFixed(1):""}</div>
    <button class="add-btn ${already?'in':''}" onclick="addItem('${payload}')">${already?"✓ Na lista":"+ Adicionar"}</button></div></div>`;
}

let PENDING=null;
function addItem(payload){
  const x=JSON.parse(decodeURIComponent(payload));
  if(ITEMS.find(i=>String(i.ext_id)===String(x.id))){ return; }
  PENDING=x;
  document.getElementById("modalbox").innerHTML=`<h3>Adicionar título</h3>
    <div style="display:flex;gap:12px;margin-bottom:14px;align-items:flex-start">
      ${x.poster?`<img src="${x.poster}" style="width:70px;border-radius:8px">`:''}
      <div><div style="font-weight:700;font-size:14px">${esc(x.title)}</div>
      <div style="font-size:12px;color:#8a93a8">${x.yr||''} · ${x.kind==='serie'?'Série':'Filme'}</div></div>
    </div>
    <label>Onde colocar?</label>
    <select id="mstatus">
      <option value="quero">Quero ver</option>
      <option value="backlog">Backlog</option>
      <option value="assistindo">Assistindo</option>
      <option value="assistido">Já assisti</option>
    </select>
    <label>Nota (0–10, opcional)</label>
    <input id="mrating" type="number" min="0" max="10" step="0.1" placeholder="—">
    <label>Comentário (opcional)</label>
    <textarea id="mnote" class="cmt" style="min-height:56px" placeholder="…"></textarea>
    <button class="btn" style="width:100%;margin-top:4px" onclick="confirmAdd()">Adicionar à lista</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancelar</button>`;
  document.getElementById("modal").style.display="flex";
}
async function confirmAdd(){
  const x=PENDING; if(!x) return;
  const status=document.getElementById("mstatus").value;
  const rv=document.getElementById("mrating").value;
  const rating=rv===""?null:Math.max(0,Math.min(10,parseFloat(rv)));
  const note=document.getElementById("mnote").value.trim()||null;
  const row={collection_id:ACTIVE,kind:x.kind,ext_id:String(x.id),title:x.title,poster:x.poster,status,rating,note,
    meta:{year:x.yr,media:x.media,vote:x.vote,genre:x.genre||""}};
  const {error}=await sb.from("items").insert(row);
  if(error){ alert("Erro ao adicionar: "+error.message); return; }
  PENDING=null; closeModal();
  document.getElementById("q").value=""; hideDropdown();
  await loadItems(); setSearchMode(false);
}
async function setStatus(id,v){ await sb.from("items").update({status:v,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.status=v; renderItems(); }
async function setRating(id,v){ const n=v===""?null:Math.max(0,Math.min(10,parseFloat(v))); await sb.from("items").update({rating:n,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.rating=n; if(FILTER==="ranking") renderItems(); }
async function setNote(id,v){ const t=v.trim()||null; await sb.from("items").update({note:t,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.note=t; }
async function delItem(id){ if(!confirm("Remover da lista?"))return; await sb.from("items").delete().eq("id",id); ITEMS=ITEMS.filter(i=>i.id!==id); renderItems(); }

async function showProv(id){
  const it=ITEMS.find(i=>i.id===id); const box=document.getElementById("prov-"+id);
  if(!it||!it.ext_id){ return; }
  box.innerHTML='<span class="lbl">buscando…</span>';
  const media=it.kind==="serie"?"tv":"movie";
  const key=media+it.ext_id;
  let br=provCache[key];
  if(!br){ const d=await tmdb(`/${media}/${it.ext_id}/watch/providers`); br=(d.results&&d.results.BR)||{}; provCache[key]=br; }
  const flat=br.flatrate||[], rent=br.rent||[], buy=br.buy||[];
  if(!flat.length&&!rent.length&&!buy.length){ box.innerHTML='<span class="lbl">Sem streaming no BR. '+(br.link?'<a href="'+br.link+'" target="_blank" style="color:#7fa8ff">ver ↗</a>':'')+'</span>'; return; }
  let h="";
  if(flat.length) h+='<span class="lbl">Assinatura:</span>'+flat.map(p=>`<img src="${LOGO}${p.logo_path}" title="${esc(p.provider_name)}">`).join("");
  if(rent.length) h+='<span class="lbl">Alugar:</span>'+rent.map(p=>`<img src="${LOGO}${p.logo_path}" title="${esc(p.provider_name)}">`).join("");
  box.innerHTML=h;
}

// ---------- modais ----------
function closeModal(){ document.getElementById("modal").style.display="none"; }
function newColModal(){
  document.getElementById("modalbox").innerHTML=`<h3>Nova lista</h3>
    <label>Nome</label><input id="mcname" placeholder="Ex: Assistidos juntos">
    <label>Tipo</label>
    <select id="mcshared"><option value="0">Pessoal (só eu)</option><option value="1">Compartilhada (convidar alguém)</option></select>
    <button class="btn" style="width:100%" onclick="createCol()">Criar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancelar</button>`;
  document.getElementById("modal").style.display="flex";
}
async function createCol(){
  const name=document.getElementById("mcname").value.trim(); if(!name){alert("Dê um nome.");return;}
  const shared=document.getElementById("mcshared").value==="1";
  const {data,error}=await sb.from("collections").insert({kind:"filmes",name,is_shared:shared}).select().single();
  if(error){alert("Erro: "+error.message);return;}
  closeModal(); ACTIVE=data.id; await loadCols();
  if(shared) shareModal();
}
function shareModal(){
  const c=COLS.find(x=>x.id===ACTIVE);
  document.getElementById("modalbox").innerHTML=`<h3>Compartilhar "${esc(c.name)}"</h3>
    <label>E-mail da pessoa</label><input id="minv" type="email" placeholder="email@gmail.com">
    <div id="minvmsg" style="font-size:12px;color:#8a93a8;min-height:16px;margin-bottom:8px"></div>
    <button class="btn" style="width:100%" onclick="doInvite()">Convidar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Fechar</button>
    <div style="font-size:11px;color:#57617a;margin-top:12px">Ela vê a lista assim que entrar com esse e-mail.</div>`;
  document.getElementById("modal").style.display="flex";
}
async function doInvite(){
  const email=document.getElementById("minv").value.trim(); const m=document.getElementById("minvmsg");
  if(!email){m.textContent="Digite o e-mail.";return;}
  m.style.color="#8a93a8"; m.textContent="Convidando…";
  const {error}=await sb.rpc("invite_to_collection",{cid:ACTIVE,invite_email:email,invite_role:"editor"});
  if(error){m.style.color="#f07567";m.textContent=error.message;return;}
  m.style.color="#3ecf9a"; m.textContent="Convite enviado! ✓";
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("click",e=>{
  if(dd().style.display==="block" && !e.target.closest(".bar") && !e.target.closest("#modal")) restoreHome();
});

initAuth();
