<style>
:root{color-scheme:dark}

body[data-theme="claro"]{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#67728a;--label:#4a5568;--border:#d8dfeb;--row:#eef1f7;--head:#e6eaf2;--input:#fff;--accent:#4f7cf7;--accent-h:#3b66e0;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(20,30,60,.07)}
body[data-theme="escuro"]{color-scheme:dark;--bg:#12151c;--card:#1c212b;--text:#e6eaf2;--muted:#8a93a8;--label:#aab3c5;--border:#323a4a;--row:#272e3b;--head:#323a4a;--input:#151a23;--accent:#4f7cf7;--accent-h:#6b90f9;--accent-t:#fff;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="rosa"]{--bg:#fdf2f7;--card:#fff;--text:#3d2233;--muted:#a1738c;--label:#7c4a63;--border:#f3cfe0;--row:#fae8f1;--head:#f3cfe0;--input:#fffafd;--accent:#e0559a;--accent-h:#c93f85;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(160,60,110,.10)}
body[data-theme="rosa-escuro"]{color-scheme:dark;--bg:#231018;--card:#321a26;--text:#fce7f3;--muted:#c48aa8;--label:#e3aec9;--border:#553046;--row:#40222f;--head:#553046;--input:#281420;--accent:#f472b6;--accent-h:#f88fc6;--accent-t:#3d0f28;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="dracula"]{color-scheme:dark;--bg:#282a36;--card:#343746;--text:#f8f8f2;--muted:#8b90a8;--label:#bdc0d4;--border:#4d5066;--row:#3d4054;--head:#4d5066;--input:#2c2e3c;--accent:#bd93f9;--accent-h:#cba6fb;--accent-t:#22232e;--pos:#50fa7b;--neg:#ff5555;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="nord"]{color-scheme:dark;--bg:#2e3440;--card:#3b4252;--text:#eceff4;--muted:#94a0b8;--label:#c2cbdc;--border:#4c566a;--row:#434c5e;--head:#4c566a;--input:#333947;--accent:#88c0d0;--accent-h:#9fd0de;--accent-t:#1d2530;--pos:#a3be8c;--neg:#bf616a;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="solarizado"]{--bg:#fdf6e3;--card:#fffbf0;--text:#403a2e;--muted:#93a1a1;--label:#657b83;--border:#e6dcc0;--row:#f3ecd7;--head:#e6dcc0;--input:#fffdf5;--accent:#268bd2;--accent-h:#1c76b6;--accent-t:#fff;--pos:#859900;--neg:#dc322f;--shadow:0 1px 4px rgba(120,100,50,.10)}
body[data-theme="oceano"]{color-scheme:dark;--bg:#0f1c2e;--card:#16283e;--text:#dcecfb;--muted:#7d95b3;--label:#a8c0dc;--border:#2c4360;--row:#1d3350;--head:#2c4360;--input:#122238;--accent:#38bdf8;--accent-h:#5ecafa;--accent-t:#08243a;--pos:#34d399;--neg:#fb7185;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="floresta"]{color-scheme:dark;--bg:#14211a;--card:#1d2f25;--text:#e2f2e7;--muted:#84a390;--label:#aecbb8;--border:#33503f;--row:#243c2f;--head:#33503f;--input:#182a20;--accent:#4ade80;--accent-h:#6ee79a;--accent-t:#0c2415;--pos:#4ade80;--neg:#f87171;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e6;--text:#43362a;--muted:#96866f;--label:#6e5c46;--border:#dfd0b4;--row:#efe5cd;--head:#dfd0b4;--input:#fffaf0;--accent:#8b5e34;--accent-h:#75492a;--accent-t:#fff8ec;--pos:#3f7d3a;--neg:#b3382c;--shadow:0 1px 4px rgba(110,80,40,.12)}
#themeSel{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto;width:auto;max-width:160px}
.mtabs{display:flex;gap:8px;margin-bottom:14px}
.mtab{padding:9px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer}
.mtab.act{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 32px}
.wrap{max-width:1400px;margin:0 auto}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.nav a,.nav button{text-decoration:none;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.nav a.act{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-size:22px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.pill{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--label);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.add{border-style:dashed;color:var(--muted)}
.pill .sh{font-size:10px;opacity:.8;margin-left:4px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:14px;outline:none}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);border:1.5px solid var(--border);color:var(--label)}
.dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;max-height:66vh;overflow:auto;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.drow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow img{width:42px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0}
.dr-noimg{width:42px;height:62px;background:var(--input);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#3a4152}
.dr-info{flex:1;min-width:0}
.dr-t{font-size:14px;font-weight:700}
.dr-y{font-size:12px;color:var(--muted)}
.dr-add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dr-add.in{background:#25324a;color:#7fa8ff}
.dr-msg{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.chip.act{background:var(--border);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px}
@media(min-width:1100px){#items.grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--input);display:block}
.card .noimg{width:100%;aspect-ratio:2/3;background:var(--input);display:flex;align-items:center;justify-content:center;font-size:34px;color:#3a4152}
.cb{padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}
.tt{font-size:15px;font-weight:700;line-height:1.25}
.yr{font-size:12px;color:var(--muted)}
.cmt{width:100%;background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px;font-size:12px;font-family:inherit;resize:vertical;min-height:34px;outline:none}
.mini.fl{border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--row);flex:1;font-size:11px}
.mini.fl.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.flbadge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border-radius:8px;padding:3px 7px;font-size:13px;z-index:2}
.wdate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wdate input{flex:1;min-width:0;background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:5px 7px;font-size:12px}
.cmt:focus{border-color:var(--accent)}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.rankbadge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;padding:3px 10px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.st{position:absolute;bottom:8px;left:8px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.st.quero{background:#3a4152;color:var(--label)}.st.backlog{background:#7a5b1e;color:#ffd98a}
.st.assistindo{background:#1e5b7a;color:#8fd4ff}.st.assistido{background:#1e7a4d;color:#8affc0}
.cardwrap{position:relative;display:flex;flex-direction:column}
.rowb{display:flex;gap:6px;align-items:center}
select,.note{background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:6px;font-size:12px}
select{flex:1}
.note{width:52px;text-align:center}
.mini{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px}
.mini:hover{color:#f07567}
.prov{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;align-items:center}
.prov img{width:42px;height:42px;border-radius:9px;aspect-ratio:1}
.prov .lbl{font-size:12px;font-weight:600;color:var(--label);width:100%;margin-top:2px}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:auto}
.add-btn.in{background:#25324a;color:#7fa8ff}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.empty{color:#57617a;font-size:14px;padding:30px;text-align:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat .sv{font-size:24px;font-weight:800;color:var(--accent)}
.stat .sl{font-size:12px;color:var(--muted);margin-top:2px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr}}
.chartcard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px}
.chartcard .ch-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;text-align:center}
.chartcard canvas{max-height:200px}
/* login */
#ov{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center}
#ovbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px;max-width:92vw}
#ovbox input{width:100%;padding:11px;margin-bottom:12px;border:1.5px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);font-size:14px;outline:none}
#ovbox button{width:100%;padding:11px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
#ovmsg{font-size:12px;margin-top:12px;min-height:16px;color:#f07567}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modalbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:380px;max-width:94vw}
#modalbox h3{font-size:16px;margin-bottom:14px}
#modalbox input,#modalbox select{width:100%;padding:10px;margin-bottom:12px;border:1.5px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);font-size:14px}
#modalbox label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
</style>
</head>
<body data-theme="escuro">

<div id="ov"><div id="ovbox">
  <div id="ovload" style="text-align:center;color:#8a93a8;font-size:14px">Carregando…</div>
  <div id="ovform" style="display:none">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">🔒 Entrar</div>

    <div id="s1"><input id="em" type="email" placeholder="Seu e-mail"><button onclick="sendCode()">Enviar código</button></div>

  </div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="nav">
    <span id="navLinks" style="display:contents"><a href="index.html">🏠 Início</a></span>
    <select id="themeSel" onchange="setTheme(this.value)" title="Tema" style="margin-left:auto">
      <option value="claro">☀️ Claro</option><option value="escuro">🌙 Escuro</option>

  <div class="mtabs" id="mtabs">
    <span class="mtab act" data-v="lista" onclick="setView('lista')">📋 Minha lista</span>

<script>
const SB_URL="https://ovpncggowjhualakjaug.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cG5jZ2dvd2podWFsYWtqYXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDI1MDIsImV4cCI6MjEwMDMxODUwMn0.yGWi4aWynDVhIEftBZcayGrbPxgqj93ckDua0zTr4zI";
const TMDB="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxYjdlNTdjZmIxNmVmY2Y2NWQzODFjODhhODEyNTdiYSIsIm5iZiI6MTc4NDkxMTU5NS45OSwic3ViIjoiNmE2Mzk2ZWI5MDkyZGQ2MjRjM2Y1YTk2Iiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.4oNFG5jVeLBj-PIkxpNFSf8ZgJYZjBpwSknRWyBfl9A";
const IMG="https://image.tmdb.org/t/p/w300";
const LOGO="https://image.tmdb.org/t/p/w92";
const sb=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
async function tmdb(path){ const r=await fetch("https://api.themoviedb.org/3"+path,{headers:{Authorization:"Bearer "+TMDB}}); return r.json(); }
const GEN_MOVIE={28:"Ação",12:"Aventura",16:"Animação",35:"Comédia",80:"Crime",99:"Documentário",18:"Drama",10751:"Família",14:"Fantasia",36:"História",27:"Terror",10402:"Música",9648:"Mistério",10749:"Romance",878:"Ficção científica",10770:"Cinema TV",53:"Thriller",10752:"Guerra",37:"Faroeste"};
const GEN_TV={10759:"Ação & Aventura",16:"Animação",35:"Comédia",80:"Crime",99:"Documentário",18:"Drama",10751:"Família",10762:"Infantil",9648:"Mistério",10763:"Notícias",10764:"Reality",10765:"Sci-Fi & Fantasia",10766:"Novela",10767:"Talk",10768:"Guerra & Política",37:"Faroeste"};
function genreName(ids,media){ const map=(media==="tv")?GEN_TV:GEN_MOVIE; if(!ids||!ids.length) return ""; return map[ids[0]]||""; }

let ME=null, COLS=[], ACTIVE=null, ITEMS=[], FILTER="todos";
const provCache={};

// ---------- login ----------
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) onLogin(); else location.href="index.html";
  sb.auth.onAuthStateChange((_e,s)=>{ if(s && document.getElementById("ov").style.display!=="none") onLogin(); });
}
function showForm(){ document.getElementById("ovload").style.display="none"; document.getElementById("ovform").style.display="block"; }
function amsg(t,ok){ const e=document.getElementById("ovmsg"); e.textContent=t; e.style.color=ok?"#3ecf9a":"#f07567"; }
async function sendCode(){
  const email=document.getElementById("em").value.trim(); if(!email){amsg("Digite seu e-mail.");return;}
  amsg("Enviando…",true);
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  if(error){amsg(error.message);return;}
  document.getElementById("s1").style.display="none"; document.getElementById("s2").style.display="block"; amsg("Código enviado!",true);
}
async function verify(){
  const email=document.getElementById("em").value.trim(), token=document.getElementById("cd").value.trim();
  if(token.length<4){amsg("Digite o código.");return;}
  amsg("Verificando…",true);
  const {error}=await sb.auth.verifyOtp({email,token,type:"email"});
  if(error) amsg(error.message);
}
function reset2(){ document.getElementById("s2").style.display="none"; document.getElementById("s1").style.display="block"; amsg(""); }
async function logout(){ try{ await sb.auth.signOut(); }catch(e){} location.href="index.html"; }

// ---------- boot ----------
async function onLogin(){
  document.getElementById("ov").style.display="none";
  document.getElementById("app").style.display="block";
  const {data:{user}}=await sb.auth.getUser(); ME=user;
  buildNav(sb,"filmes");
  try{ await sb.rpc("claim_invites"); }catch(e){ console.warn("claim",e); }
  await loadCols();
}

async function loadCols(){
  const {data,error}=await sb.from("collections").select("*").eq("kind","filmes").order("created_at");
  if(error){ console.warn(error); }
  COLS=data||[];
  if(!COLS.length){
    // cria a lista pessoal padrão na primeira vez
    await sb.from("collections").insert({kind:"filmes",name:"Minha lista",is_shared:false});
    const {data:d2}=await sb.from("collections").select("*").eq("kind","filmes").order("created_at");
    COLS=d2||[];
  }
  if(!ACTIVE || !COLS.find(c=>c.id===ACTIVE)) ACTIVE=COLS[0]?.id;
  renderPills();
  await loadItems();
  showReleases();
}

  const filmes=ITEMS.filter(i=>i.kind!=="serie").length, series=ITEMS.length-filmes;
  const topN=(o,n)=>{ const ks=Object.keys(o).sort((a,b)=>o[b]-o[a]); const t=ks.slice(0,n); const rest=ks.slice(n).reduce((s,x)=>s+o[x],0); const labels=t.slice(),data=t.map(x=>o[x]); if(rest){labels.push("Outros");data.push(rest);} return {labels,data}; };

      <div class="stat"><div class="sv">${favs}</div><div class="sl">⭐ Favoritos</div></div>
      <div class="stat"><div class="sv">${life}</div><div class="sl">🏆 Da minha vida</div></div>
    </div>
    <div class="charts-grid">
      <div class="chartcard"><div class="ch-t">Gêneros</div><canvas id="chGen"></canvas></div>
      <div class="chartcard"><div class="ch-t">Assistido vs. a ver · Filmes vs. séries</div><canvas id="chStatus"></canvas></div>
      <div class="chartcard"><div class="ch-t">⭐ Favoritos & 🏆 Da minha vida</div><canvas id="chFav"></canvas></div>
    </div>
    <div class="chartcard" style="margin-bottom:16px"><div class="ch-t">📅 Assistidos por ano</div><canvas id="chYear" style="max-height:170px"></canvas></div>`;
  Object.values(CHARTS).forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS={};
  if(typeof Chart==="undefined") return;
  const pal=['#6d4bf6','#3ecf9a','#f59e0b','#f472b6','#38bdf8','#a855f7','#f07567','#94a0b8'];
  const dough=(id,labels,data,colors,onClick)=>new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,onClick:onClick,plugins:{legend:{position:'bottom',labels:{color:'#aab3c5',font:{size:11},boxWidth:12,padding:8}}},cutout:'55%'}});
  CHARTS.gen=dough('chGen',G.labels,G.data,pal,(e,el)=>{ if(!el.length)return; const l=G.labels[el[0].index]; FGEN=(FGEN===l)?"":l; FKIND=""; FYEAR=""; FILTER="todos"; document.querySelectorAll("#filters .chip").forEach(c=>c.classList.toggle("act",c.dataset.f==="todos")); renderItems(); setView('lista'); });
  CHARTS.status=dough('chStatus',['Assistidos','A ver','Filmes','Séries'],[vistos.length,ITEMS.length-vistos.length,filmes,series],['#3ecf9a','#4d5566','#6d4bf6','#38bdf8'],(e,el)=>{ if(!el.length)return; const idx=el[0].index; if(idx===0){setFilter('assistido');} else if(idx===1){setFilter('todos');} else { FGEN=""; FYEAR=""; FKIND=(idx===3)?((FKIND==="serie")?"":"serie"):((FKIND==="filme")?"":"filme"); FILTER="todos"; renderItems(); } setView('lista'); });
  CHARTS.fav=dough('chFav',['⭐ Favoritos','🏆 Da minha vida','Demais'],[favs,life,Math.max(0,ITEMS.length-favs-life)],['#f5b301','#e0559a','#4d5566'],(e,el)=>{ if(!el.length)return; const idx=el[0].index; setFilter(idx===0?'fav':idx===1?'life':'todos'); });
  const anosMap={}; vistos.forEach(i=>{ const y=(i.done_date||"").slice(0,4); if(y) anosMap[y]=(anosMap[y]||0)+1; });
  const years=Object.keys(anosMap).sort();
  CHARTS.year=new Chart(document.getElementById('chYear'),{type:'bar',data:{labels:years,datasets:[{data:years.map(y=>anosMap[y]),backgroundColor:'#6d4bf6'}]},options:{onClick:(e,el)=>{ if(!el.length)return; const y=years[el[0].index]; FYEAR=(FYEAR===y)?"":y; FGEN=""; FKIND=""; FILTER="todos"; renderItems(); setView('lista'); },plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aab3c5',font:{size:11}}},y:{beginAtZero:true,ticks:{color:'#aab3c5',precision:0}}}}});
}

let FGEN="", FKIND="", FYEAR="";
function setFilter(f){ FILTER=f; FGEN=""; FKIND=""; FYEAR=""; document.querySelectorAll("#filters .chip").forEach(c=>c.classList.toggle("act",c.dataset.f===f)); renderItems(); setView('lista'); }

const STLBL={quero:"Quero ver",backlog:"Backlog",assistindo:"Assistindo",assistido:"Assistido"};
function renderItems(){
  const box=document.getElementById("items");
  if(FILTER==="ranking"){
    const ranked=ITEMS.filter(i=>i.rating!=null).sort((a,b)=>b.rating-a.rating);
    if(!ranked.length){ box.innerHTML='<div class="empty">Dê notas aos filmes pra montar o ranking. 🏆</div>'; return; }
    box.innerHTML=ranked.map((i,idx)=>itemCard(i,idx+1)).join("");
    return;
  }
  let list;
  if(FILTER==="fav") list=ITEMS.filter(i=>i.meta&&i.meta.fav);
  else if(FILTER==="life") list=ITEMS.filter(i=>i.meta&&i.meta.life);
  else list = FILTER==="todos"?ITEMS:ITEMS.filter(i=>(i.status||"quero")===FILTER);
  if(FGEN) list=list.filter(i=>(((i.meta&&i.meta.genre)||"").trim()||"Outros")===FGEN);
  if(FKIND) list=list.filter(i=>(FKIND==="serie"?i.kind==="serie":i.kind!=="serie"));
  if(FYEAR) list=list.filter(i=>(i.done_date||"").slice(0,4)===FYEAR);
  if(!list.length){ box.innerHTML='<div class="empty">Nenhum título com esses filtros. 🎬</div>'; return; }
  box.innerHTML=list.map(i=>itemCard(i)).join("");
}
function medal(n){ return n===1?"🥇":n===2?"🥈":n===3?"🥉":"#"+n; }

function itemCard(i,rank){
  const yr=(i.meta&&i.meta.year)||"";
  const poster=i.poster?`<img src="${i.poster}" loading="lazy">`:`<div class="noimg">🎬</div>`;
  const kindTag=i.kind==="serie"?"Série":"Filme";
  const st=i.status||"quero";
  const rankB=rank?`<span class="rankbadge">${medal(rank)}${i.rating!=null?' · '+i.rating:''}</span>`:"";
  const m=i.meta||{}, fav=!!m.fav, life=!!m.life;
  const flBadge=(fav||life)?`<span class="flbadge">${life?'🏆':''}${fav?'⭐':''}</span>`:"";
  return `<div class="card"><div class="cardwrap">
    ${poster}<span class="tag">${kindTag}</span>${rankB}${flBadge}<span class="st ${st}">${STLBL[st]||st}</span></div>
    <div class="cb">
      <div class="tt">${esc(i.title)}</div>
      <div class="yr">${yr}</div>
      <div class="rowb" style="gap:8px">
        <button class="mini fl ${fav?'on':''}" onclick="setFav('${i.id}')" title="Favorito">${fav?'⭐ Favorito':'☆ Favoritar'}</button>
        <button class="mini fl ${life?'on':''}" onclick="setLife('${i.id}')" title="Da minha vida">${life?'🏆 Da minha vida':'🏆 Marcar'}</button>
      </div>
      <div class="rowb">
        <select onchange="setStatus('${i.id}',this.value)">
          <option value="quero" ${st==="quero"?"selected":""}>Quero ver</option>
          <option value="backlog" ${st==="backlog"?"selected":""}>Backlog</option>
          <option value="assistindo" ${st==="assistindo"?"selected":""}>Assistindo</option>
          <option value="assistido" ${st==="assistido"?"selected":""}>Assistido</option>
        </select>
        <input class="note" type="number" min="0" max="10" step="0.1" placeholder="—" value="${i.rating??""}" onchange="setRating('${i.id}',this.value)" title="Nota 0-10">
      </div>
      ${st==="assistido"?`<div class="wdate">📅 <span>Assisti em</span> <input type="date" value="${i.done_date||''}" onchange="setWatchDate('${i.id}',this.value)"></div>`:""}
      <textarea class="cmt" placeholder="Comentário…" onchange="setNote('${i.id}',this.value)">${esc(i.note||"")}</textarea>
      <div class="prov" id="prov-${i.id}"></div>
      <div class="rowb" style="justify-content:space-between">
        <button class="mini" onclick="showProv('${i.id}')">📺 Onde assistir</button>
        <button class="mini" onclick="delItem('${i.id}')">remover</button>
      </div>
    </div></div>`;
}

let _t;

function dd(){ return document.getElementById("dropdown"); }
function hideDropdown(){ dd().style.display="none"; dd().innerHTML=""; }
// mostra/esconde a "casa" (lista + 50 melhores) durante a busca

function restoreHome(){ document.getElementById("q").value=""; hideDropdown(); setSearchMode(false); }

async function showReleases(){
  const R=document.getElementById("results");
  // gênero mais comum da sua lista → recomenda FILMES e SÉRIES desse gênero; senão, populares de tudo
  const gc={}; ITEMS.forEach(i=>{ const g=(i.meta&&i.meta.genre)||""; if(g) gc[g]=(gc[g]||0)+1; });
  const topGenre=Object.keys(gc).sort((a,b)=>gc[b]-gc[a])[0];
  const REVm={}; Object.entries(GEN_MOVIE).forEach(([id,nm])=>{ REVm[nm]=id; });
  const REVt={}; Object.entries(GEN_TV).forEach(([id,nm])=>{ REVt[nm]=id; });
  const mGid=topGenre?REVm[topGenre]:null, tGid=topGenre?REVt[topGenre]:null;
  const perso=!!topGenre;
  const titulo=perso?`✨ Recomendados — ${esc(topGenre)} (filmes e séries)`:"⭐ Populares — filmes e séries";
  R.innerHTML=`<div class="sec-title">${titulo}</div><div class="empty">Carregando…</div>`;
  // página aleatória (1-4) pra trazer opções diferentes toda vez que você adiciona algo
  const p=1+Math.floor(Math.random()*4);
  const moviePath = perso&&mGid ? `/discover/movie?with_genres=${mGid}&sort_by=popularity.desc&vote_count.gte=150&language=pt-BR&page=${p}` : `/movie/popular?language=pt-BR&region=BR&page=${p}`;
  const tvPath    = perso&&tGid ? `/discover/tv?with_genres=${tGid}&sort_by=popularity.desc&vote_count.gte=100&language=pt-BR&page=${p}`   : `/tv/popular?language=pt-BR&page=${p}`;
  const [dm,dt]=await Promise.all([tmdb(moviePath),tmdb(tvPath)]);
  (dm.results||[]).forEach(x=>x.media_type="movie");
  (dt.results||[]).forEach(x=>x.media_type="tv");
  const shelf=new Set(ITEMS.map(i=>String(i.ext_id))); const seen=new Set();
  let all=[...(dm.results||[]),...(dt.results||[])].filter(x=>{ if(!x.poster_path||seen.has(x.id)||shelf.has(String(x.id)))return false; seen.add(x.id); return true; });
  // embaralha pra misturar filmes e séries e variar a ordem
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  all=all.slice(0,14);
  if(!all.length){ R.innerHTML=""; return; }
  R.innerHTML=`<div class="sec-title">${titulo}</div><div class="grid">`+all.map(searchCard).join("")+'</div>';
}

async function doSearch(){
  const q=document.getElementById("q").value.trim();
  if(q.length<2){ hideDropdown(); return; }   // não zera o campo nem mexe no layout (o dropdown é sobreposto)
  dd().style.display="block";
  dd().innerHTML='<div class="dr-msg">Buscando…</div>';
  const d=await tmdb(`/search/multi?query=${encodeURIComponent(q)}&language=pt-BR&page=1`);
  const res=(d.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").slice(0,20);
  if(document.getElementById("q").value.trim()!==q) return; // busca antiga
  if(!res.length){ dd().innerHTML='<div class="dr-msg">Nada encontrado.</div>'; return; }
  dd().innerHTML=res.map(dropRow).join("");
}
function dropRow(x){
  const title=x.title||x.name||"—";
  const date=x.release_date||x.first_air_date||"";
  const yr=date?date.slice(0,4):"";
  const kind=x.media_type==="tv"?"serie":"filme";
  const poster=x.poster_path?`<img src="${LOGO}${x.poster_path}" loading="lazy">`:`<div class="dr-noimg">🎬</div>`;
  const already=ITEMS.find(i=>String(i.ext_id)===String(x.id));
  const payload=encodeURIComponent(JSON.stringify({id:x.id,title,yr,kind,poster:x.poster_path?IMG+x.poster_path:"",media:x.media_type,vote:x.vote_average,genre:genreName(x.genre_ids,x.media_type)})).replace(/'/g,"%27");
  return `<div class="drow">${poster}
    <div class="dr-info"><div class="dr-t">${esc(title)}</div>
    <div class="dr-y">${yr} · ${kind==="serie"?"Série":"Filme"}${x.vote_average?" · ⭐"+x.vote_average.toFixed(1):""}</div></div>
    <button class="dr-add ${already?'in':''}" onclick="addItem('${payload}')">${already?"✓ Na lista":"+ Adicionar"}</button></div>`;
}
function searchCard(x){
  const title=x.title||x.name||"—";
  const date=x.release_date||x.first_air_date||"";
  const yr=date?date.slice(0,4):"";
  const poster=x.poster_path?`<img src="${IMG}${x.poster_path}" loading="lazy">`:`<div class="noimg">🎬</div>`;
  const kind=x.media_type==="tv"?"serie":"filme";
  const already=ITEMS.find(i=>String(i.ext_id)===String(x.id));
  const payload=encodeURIComponent(JSON.stringify({id:x.id,title,yr,kind,poster:x.poster_path?IMG+x.poster_path:"",media:x.media_type,vote:x.vote_average,genre:genreName(x.genre_ids,x.media_type)})).replace(/'/g,"%27");
  return `<div class="card"><div class="cardwrap">${poster}<span class="tag">${kind==="serie"?"Série":"Filme"}</span></div>
    <div class="cb"><div class="tt">${esc(title)}</div><div class="yr">${yr}${x.vote_average?" · ⭐"+x.vote_average.toFixed(1):""}</div>
    <button class="add-btn ${already?'in':''}" onclick="addItem('${payload}')">${already?"✓ Na lista":"+ Adicionar"}</button></div></div>`;
}

let PENDING=null;

  const x=JSON.parse(decodeURIComponent(payload));
  if(ITEMS.find(i=>String(i.ext_id)===String(x.id))){ return; }
  PENDING=x;
  document.getElementById("modalbox").innerHTML=`<h3>Adicionar título</h3>
    <div style="display:flex;gap:12px;margin-bottom:14px;align-items:flex-start">
      ${x.poster?`<img src="${x.poster}" style="width:70px;border-radius:8px">`:''}
      <div><div style="font-weight:700;font-size:14px">${esc(x.title)}</div>
      <div style="font-size:12px;color:#8a93a8">${x.yr||''} · ${x.kind==='serie'?'Série':'Filme'}</div></div>
    </div>
    <label>Onde colocar?</label>
    <select id="mstatus" onchange="updateWatchDate()">
      <option value="quero">Quero ver</option>
      <option value="backlog">Backlog</option>
      <option value="assistindo">Assistindo</option>
      <option value="assistido">Já assisti</option>
    </select>
    <div id="mdaterow" style="display:none"><label>📅 Data que assisti</label><input id="mdate" type="date"></div>
    <label>Nota (0–10, opcional)</label>
    <input id="mrating" type="number" min="0" max="10" step="0.1" placeholder="—">
    <label>Comentário (opcional)</label>
    <textarea id="mnote" class="cmt" style="min-height:56px" placeholder="…"></textarea>
    <button class="btn" style="width:100%;margin-top:4px" onclick="confirmAdd()">Adicionar à lista</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancelar</button>`;
  document.getElementById("modal").style.display="flex";

function updateWatchDate(){
  const st=document.getElementById("mstatus").value, row=document.getElementById("mdaterow"), d=document.getElementById("mdate");
  if(st==="assistido"){ row.style.display="block"; if(!d.value) d.value=new Date().toISOString().slice(0,10); }
  else row.style.display="none";
}
async function confirmAdd(){
  const x=PENDING; if(!x) return;
  const status=document.getElementById("mstatus").value;
  const rv=document.getElementById("mrating").value;
  const rating=rv===""?null:Math.max(0,Math.min(10,parseFloat(rv)));
  const note=document.getElementById("mnote").value.trim()||null;
  const dateVal=document.getElementById("mdate").value||null;
  const row={collection_id:ACTIVE,kind:x.kind,ext_id:String(x.id),title:x.title,poster:x.poster,status,rating,note,
    meta:{year:x.yr,media:x.media,vote:x.vote,genre:x.genre||""}};
  if(status==="assistido") row.done_date=dateVal||new Date().toISOString().slice(0,10);
  const {error}=await sb.from("items").insert(row);
  if(error){ alert("Erro ao adicionar: "+error.message); return; }
  PENDING=null; closeModal();
  document.getElementById("q").value=""; hideDropdown();
  await loadItems(); setSearchMode(false);
}
async function setStatus(id,v){
  const it=ITEMS.find(i=>i.id===id);
  const upd={status:v,updated_at:new Date().toISOString()};
  if(v==="assistido" && !(it&&it.done_date)) upd.done_date=new Date().toISOString().slice(0,10);
  await sb.from("items").update(upd).eq("id",id);
  if(it){ it.status=v; if(upd.done_date) it.done_date=upd.done_date; }
  renderStats(); renderItems();
}
async function setFlag(id,campo){
  const it=ITEMS.find(i=>i.id===id); if(!it) return; const m=Object.assign({},it.meta||{});
  m[campo]=!m[campo]; it.meta=m;
  await sb.from("items").update({meta:m,updated_at:new Date().toISOString()}).eq("id",id);
  renderStats(); renderItems();
}
function setFav(id){ setFlag(id,"fav"); }
function setLife(id){ setFlag(id,"life"); }
async function setWatchDate(id,val){
  await sb.from("items").update({done_date:val||null,updated_at:new Date().toISOString()}).eq("id",id);
  const it=ITEMS.find(i=>i.id===id); if(it) it.done_date=val||null; renderStats();
}
async function setRating(id,v){ const n=v===""?null:Math.max(0,Math.min(10,parseFloat(v))); await sb.from("items").update({rating:n,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.rating=n; if(FILTER==="ranking") renderItems(); }
async function setNote(id,v){ const t=v.trim()||null; await sb.from("items").update({note:t,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.note=t; }
async function delItem(id){ if(!confirm("Remover da lista?"))return; await sb.from("items").delete().eq("id",id); ITEMS=ITEMS.filter(i=>i.id!==id); renderItems(); }

async function showProv(id){
  const it=ITEMS.find(i=>i.id===id); const box=document.getElementById("prov-"+id);
  if(!it||!it.ext_id){ return; }
  box.innerHTML='<span class="lbl">buscando…</span>';
  const media=it.kind==="serie"?"tv":"movie";
  const key=media+it.ext_id;
  let br=provCache[key];
  if(!br){ const d=await tmdb(`/${media}/${it.ext_id}/watch/providers`); br=(d.results&&d.results.BR)||{}; provCache[key]=br; }
  const flat=br.flatrate||[], rent=br.rent||[], buy=br.buy||[];
  if(!flat.length&&!rent.length&&!buy.length){ box.innerHTML='<span class="lbl">Sem streaming no BR. '+(br.link?'<a href="'+br.link+'" target="_blank" style="color:#7fa8ff">ver ↗</a>':'')+'</span>'; return; }
  let h="";
  if(flat.length) h+='<span class="lbl">Assinatura:</span>'+flat.map(p=>`<img src="${LOGO}${p.logo_path}" title="${esc(p.provider_name)}">`).join("");
  if(rent.length) h+='<span class="lbl">Alugar:</span>'+rent.map(p=>`<img src="${LOGO}${p.logo_path}" title="${esc(p.provider_name)}">`).join("");
  box.innerHTML=h;
}

// ---------- modais ----------
function closeModal(){ document.getElementById("modal").style.display="none"; }
function newColModal(){
  document.getElementById("modalbox").innerHTML=`<h3>Nova lista</h3>
    <label>Nome</label><input id="mcname" placeholder="Ex: Assistidos juntos">
    <label>Tipo</label>
    <select id="mcshared"><option value="0">Pessoal (só eu)</option><option value="1">Compartilhada (convidar alguém)</option></select>
    <button class="btn" style="width:100%" onclick="createCol()">Criar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancelar</button>`;
  document.getElementById("modal").style.display="flex";
}
async function createCol(){
  const name=document.getElementById("mcname").value.trim(); if(!name){alert("Dê um nome.");return;}
  const shared=document.getElementById("mcshared").value==="1";
  const {data,error}=await sb.from("collections").insert({kind:"filmes",name,is_shared:shared}).select().single();
  if(error){alert("Erro: "+error.message);return;}
  closeModal(); ACTIVE=data.id; await loadCols();
  if(shared) shareModal();
}
function shareModal(){
  const c=COLS.find(x=>x.id===ACTIVE);
  document.getElementById("modalbox").innerHTML=`<h3>Compartilhar "${esc(c.name)}"</h3>
    <label>E-mail da pessoa</label><input id="minv" type="email" placeholder="email@gmail.com">
    <div id="minvmsg" style="font-size:12px;color:#8a93a8;min-height:16px;margin-bottom:8px"></div>
    <button class="btn" style="width:100%" onclick="doInvite()">Convidar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Fechar</button>
    <div style="font-size:11px;color:#57617a;margin-top:12px">Ela vê a lista assim que entrar com esse e-mail.</div>`;
  document.getElementById("modal").style.display="flex";
}
async function doInvite(){
  const email=document.getElementById("minv").value.trim(); const m=document.getElementById("minvmsg");
  if(!email){m.textContent="Digite o e-mail.";return;}
  m.style.color="#8a93a8"; m.textContent="Convidando…";
  const {error}=await sb.rpc("invite_to_collection",{cid:ACTIVE,invite_email:email,invite_role:"editor"});
  if(error){m.style.color="#f07567";m.textContent=error.message;return;}
  m.style.color="#3ecf9a"; m.textContent="Convite enviado! ✓";
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("click",e=>{
  if(dd().style.display==="block" && !e.target.closest(".bar") && !e.target.closest("#modal")) restoreHome();
});

const PAGE="filmes";
function currentTheme(){ return localStorage.getItem("themeOverride_"+PAGE)||localStorage.getItem("assistTheme")||"escuro"; }
function applyTheme(){ const t=currentTheme(); document.body.dataset.theme=t; const s=document.getElementById("themeSel"); if(s) s.value=t; }
function setTheme(t){
  const all=confirm("Aplicar este tema em TODOS os módulos?\n\nOK = todos os módulos\nCancelar = só nesta tela");
  if(all){ localStorage.setItem("assistTheme",t); localStorage.removeItem("themeOverride_"+PAGE); }
  else { localStorage.setItem("themeOverride_"+PAGE,t); }
  document.body.dataset.theme=t;
}
applyTheme();
initAuth();
</script>
