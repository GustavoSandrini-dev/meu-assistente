<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefas & Rotina</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark}
body[data-theme="claro"]{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#67728a;--label:#4a5568;--border:#d8dfeb;--row:#eef1f7;--head:#e6eaf2;--input:#fff;--accent:#4f7cf7;--accent-h:#3b66e0;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(20,30,60,.07)}
body[data-theme="escuro"]{color-scheme:dark;--bg:#12151c;--card:#1c212b;--text:#e6eaf2;--muted:#8a93a8;--label:#aab3c5;--border:#323a4a;--row:#272e3b;--head:#323a4a;--input:#151a23;--accent:#4f7cf7;--accent-h:#6b90f9;--accent-t:#fff;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="rosa"]{--bg:#fdf2f7;--card:#fff;--text:#3d2233;--muted:#a1738c;--label:#7c4a63;--border:#f3cfe0;--row:#fae8f1;--head:#f3cfe0;--input:#fffafd;--accent:#e0559a;--accent-h:#c93f85;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(160,60,110,.10)}
body[data-theme="rosa-escuro"]{color-scheme:dark;--bg:#231018;--card:#321a26;--text:#fce7f3;--muted:#c48aa8;--label:#e3aec9;--border:#553046;--row:#40222f;--head:#553046;--input:#281420;--accent:#f472b6;--accent-h:#f88fc6;--accent-t:#3d0f28;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="dracula"]{color-scheme:dark;--bg:#282a36;--card:#343746;--text:#f8f8f2;--muted:#8b90a8;--label:#bdc0d4;--border:#4d5066;--row:#3d4054;--head:#4d5066;--input:#2c2e3c;--accent:#bd93f9;--accent-h:#cba6fb;--accent-t:#22232e;--pos:#50fa7b;--neg:#ff5555;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="nord"]{color-scheme:dark;--bg:#2e3440;--card:#3b4252;--text:#eceff4;--muted:#94a0b8;--label:#c2cbdc;--border:#4c566a;--row:#434c5e;--head:#4c566a;--input:#333947;--accent:#88c0d0;--accent-h:#9fd0de;--accent-t:#1d2530;--pos:#a3be8c;--neg:#bf616a;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="solarizado"]{--bg:#fdf6e3;--card:#fffbf0;--text:#403a2e;--muted:#93a1a1;--label:#657b83;--border:#e6dcc0;--row:#f3ecd7;--head:#e6dcc0;--input:#fffdf5;--accent:#268bd2;--accent-h:#1c76b6;--accent-t:#fff;--pos:#859900;--neg:#dc322f;--shadow:0 1px 4px rgba(120,100,50,.10)}
body[data-theme="oceano"]{color-scheme:dark;--bg:#0f1c2e;--card:#16283e;--text:#dcecfb;--muted:#7d95b3;--label:#a8c0dc;--border:#2c4360;--row:#1d3350;--head:#2c4360;--input:#122238;--accent:#38bdf8;--accent-h:#5ecafa;--accent-t:#08243a;--pos:#34d399;--neg:#fb7185;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="floresta"]{color-scheme:dark;--bg:#14211a;--card:#1d2f25;--text:#e2f2e7;--muted:#84a390;--label:#aecbb8;--border:#33503f;--row:#243c2f;--head:#33503f;--input:#182a20;--accent:#4ade80;--accent-h:#6ee79a;--accent-t:#0c2415;--pos:#4ade80;--neg:#f87171;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e6;--text:#43362a;--muted:#96866f;--label:#6e5c46;--border:#dfd0b4;--row:#efe5cd;--head:#dfd0b4;--input:#fffaf0;--accent:#8b5e34;--accent-h:#75492a;--accent-t:#fff8ec;--pos:#3f7d3a;--neg:#b3382c;--shadow:0 1px 4px rgba(110,80,40,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 32px}
.wrap{max-width:1200px;margin:0 auto}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.navrow a,.navrow button,.navrow select{text-decoration:none;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
#themeSel{flex:0 0 auto;width:auto;max-width:160px}
h1{font-size:22px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer}
.tab.act{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-t);border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--muted);border:1.5px solid var(--border)}
.tk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--row);margin-bottom:8px}
.tk.done{opacity:.55}
.tk.done .tk-t{text-decoration:line-through}
.tk-cb{width:20px;height:20px;flex:0 0 auto;cursor:pointer;accent-color:var(--accent)}
.tk-t{flex:1;font-size:14px;font-weight:600;min-width:0;word-break:break-word}
.tk-d{font-size:12px;color:var(--muted);flex:0 0 auto}
.tk-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;flex:0 0 auto}
.tk-x:hover{color:var(--neg)}
.prio{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.prio.alta{background:#f07567}.prio.media{background:#f5b301}.prio.baixa{background:#3ecf9a}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.day{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.day h3{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.slot{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.slot:last-child{border-bottom:none}
.slot .t{font-weight:700;color:var(--accent);flex:0 0 auto;font-variant-numeric:tabular-nums}
.slot .a{flex:1;min-width:0;word-break:break-word}
.slot .x{background:none;border:none;color:var(--muted);cursor:pointer}
.slot .x:hover{color:var(--neg)}
.dayadd{display:flex;gap:6px;margin-top:8px}
.dayadd input{padding:6px 8px;font-size:12px}
.dayadd input.time{width:74px;flex:0 0 auto}
.dayadd button{background:var(--accent);color:var(--accent-t);border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.stat{display:inline-block;background:var(--row);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;margin:0 8px 8px 0}
.stat b{color:var(--accent)}
</style>
</head>
<body data-theme="escuro">
<div class="wrap" id="app" style="display:none">
  <div class="navrow">
    <div id="appNav" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a href="index.html">🏠 Início</a>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <select id="themeSel" onchange="setTheme(this.value)" title="Tema">
        <option value="claro">☀️ Claro</option><option value="escuro">🌙 Escuro</option>
        <option value="rosa">🌸 Rosa</option><option value="rosa-escuro">🌷 Rosa escuro</option>
        <option value="dracula">🧛 Drácula</option><option value="nord">❄️ Nord</option>
        <option value="solarizado">🌅 Solarizado</option><option value="oceano">🌊 Oceano</option>
        <option value="floresta">🌲 Floresta</option><option value="sepia">📜 Sépia</option>
      </select>
      <button onclick="logout()">Sair</button>
    </div>
  </div>

  <h1>✅ Tarefas & Rotina</h1>
  <div class="sub">Organize suas tarefas e monte sua rotina da semana.</div>

  <div class="tabs">
    <span class="tab act" data-t="tarefas" onclick="setTab('tarefas')">✅ Tarefas</span>
    <span class="tab" data-t="rotina" onclick="setTab('rotina')">🗓️ Rotina</span>
  </div>

  <div id="view-tarefas">
    <div id="tkStats"></div>
    <div class="addbar">
      <input id="tkText" placeholder="Nova tarefa… (ex: Pagar conta de luz)" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')addTask()">
      <input id="tkDate" type="date" title="Prazo (opcional)">
      <select id="tkPrio" title="Prioridade"><option value="media">🟡 Média</option><option value="alta">🔴 Alta</option><option value="baixa">🟢 Baixa</option></select>
      <button class="btn" onclick="addTask()">➕ Adicionar</button>
    </div>
    <div class="addbar" style="margin-bottom:16px">
      <span class="tab act" data-tf="todas" onclick="setTaskFilter('todas')" style="font-size:12px;padding:6px 12px">Todas</span>
      <span class="tab" data-tf="abertas" onclick="setTaskFilter('abertas')" style="font-size:12px;padding:6px 12px">Pendentes</span>
      <span class="tab" data-tf="feitas" onclick="setTaskFilter('feitas')" style="font-size:12px;padding:6px 12px">Concluídas</span>
    </div>
    <div id="tkList"></div>
  </div>

  <div id="view-rotina" style="display:none">
    <div class="sub" style="margin-bottom:12px">Adicione horários e atividades pra cada dia. É a sua rotina — monte do seu jeito.</div>
    <div class="days" id="rotDays"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
const SB_URL="https://ovpncggowjhualakjaug.supabase.co", SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cG5jZ2dvd2podWFsYWtqYXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDI1MDIsImV4cCI6MjEwMDMxODUwMn0.yGWi4aWynDVhIEftBZcayGrbPxgqj93ckDua0zTr4zI";
const STATE_KEY="tarefas", STORAGE_KEY="tarefas";
const _sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

// ----- tema -----
const PAGE="tarefas";
function currentTheme(){ return localStorage.getItem("themeOverride_"+PAGE)||localStorage.getItem("assistTheme")||"escuro"; }
function applyTheme(){ const t=currentTheme(); document.body.dataset.theme=t; const s=document.getElementById("themeSel"); if(s) s.value=t; }
function setTheme(t){
  const all=confirm("Aplicar este tema em TODOS os módulos?\n\nOK = todos os módulos\nCancelar = só nesta tela");
  if(all){ localStorage.setItem("assistTheme",t); localStorage.removeItem("themeOverride_"+PAGE); }
  else { localStorage.setItem("themeOverride_"+PAGE,t); }
  document.body.dataset.theme=t;
}
applyTheme();

// ----- dados (por usuário, via app_state) -----
const DAYS=[["seg","Segunda"],["ter","Terça"],["qua","Quarta"],["qui","Quinta"],["sex","Sexta"],["sab","Sábado"],["dom","Domingo"]];
let DATA={tasks:[], routine:{}};
function load(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); }catch(e){ return {}; } }
function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); queueSync(); }
function normalize(){ if(!DATA.tasks) DATA.tasks=[]; if(!DATA.routine) DATA.routine={}; DAYS.forEach(([k])=>{ if(!DATA.routine[k]) DATA.routine[k]=[]; }); }

let _syncT;
function queueSync(){ clearTimeout(_syncT); _syncT=setTimeout(pushState,500); }
async function hydrate(){
  try{
    const {data:{user}}=await _sb.auth.getUser(); if(!user) return;
    const owner=localStorage.getItem(STORAGE_KEY+"_owner");
    if(owner && owner!==user.id) localStorage.removeItem(STORAGE_KEY);
    const {data}=await _sb.from("app_state").select("value").eq("key",STATE_KEY).eq("user_id",user.id).maybeSingle();
    if(data && data.value){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data.value)); }
    else { const local=localStorage.getItem(STORAGE_KEY); if(local && owner===user.id) await _sb.from("app_state").upsert({key:STATE_KEY,user_id:user.id,value:JSON.parse(local)},{onConflict:"user_id,key"}); }
    localStorage.setItem(STORAGE_KEY+"_owner", user.id);
  }catch(e){ console.warn("hydrate",e); }
}
async function pushState(){
  try{
    const {data:{user}}=await _sb.auth.getUser(); if(!user) return;
    if(localStorage.getItem(STORAGE_KEY+"_owner")!==user.id) return;
    await _sb.from("app_state").upsert({key:STATE_KEY,user_id:user.id,value:DATA},{onConflict:"user_id,key"});
  }catch(e){ console.warn("sync",e); }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pushState(); });
window.addEventListener("pagehide",pushState);

// ----- abas -----
function setTab(t){
  document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.toggle("act",x.dataset.t===t));
  document.getElementById("view-tarefas").style.display = t==="tarefas"?"block":"none";
  document.getElementById("view-rotina").style.display = t==="rotina"?"block":"none";
  if(t==="rotina") renderRoutine();
}

// ----- tarefas -----
let TF="todas";
function setTaskFilter(f){ TF=f; document.querySelectorAll("[data-tf]").forEach(x=>x.classList.toggle("act",x.dataset.tf===f)); renderTasks(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function addTask(){
  const el=document.getElementById("tkText"), text=el.value.trim(); if(!text) return;
  const date=document.getElementById("tkDate").value||"";
  const prio=document.getElementById("tkPrio").value;
  DATA.tasks.unshift({id:uid(),text,done:false,date,prio});
  el.value=""; document.getElementById("tkDate").value="";
  persist(); renderTasks();
}
function toggleTask(id){ const t=DATA.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; persist(); renderTasks(); } }
function delTask(id){ DATA.tasks=DATA.tasks.filter(x=>x.id!==id); persist(); renderTasks(); }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return dd+"/"+m; }
function renderTasks(){
  const box=document.getElementById("tkList");
  let list=DATA.tasks.slice();
  if(TF==="abertas") list=list.filter(t=>!t.done);
  if(TF==="feitas") list=list.filter(t=>t.done);
  // ordena: pendentes primeiro, por prazo
  list.sort((a,b)=> (a.done-b.done) || ((a.date||"9999")<(b.date||"9999")?-1:1));
  const total=DATA.tasks.length, feitas=DATA.tasks.filter(t=>t.done).length;
  document.getElementById("tkStats").innerHTML=`<span class="stat">📋 <b>${total-feitas}</b> pendentes</span><span class="stat">✅ <b>${feitas}</b> concluídas</span>`;
  if(!list.length){ box.innerHTML='<div class="empty">Nenhuma tarefa aqui. Adicione a primeira! ✅</div>'; return; }
  const hoje=new Date().toISOString().slice(0,10);
  box.innerHTML=list.map(t=>{
    const atrasada=!t.done && t.date && t.date<hoje;
    return `<div class="tk ${t.done?'done':''}">
      <span class="prio ${t.prio||'media'}"></span>
      <input type="checkbox" class="tk-cb" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
      <span class="tk-t">${esc(t.text)}</span>
      ${t.date?`<span class="tk-d" style="${atrasada?'color:var(--neg);font-weight:700':''}">📅 ${fmtDate(t.date)}${atrasada?' ⚠️':''}</span>`:''}
      <button class="tk-x" onclick="delTask('${t.id}')">✕</button>
    </div>`;
  }).join("");
}

// ----- rotina -----
function renderRoutine(){
  const box=document.getElementById("rotDays");
  box.innerHTML=DAYS.map(([k,nome])=>{
    const slots=(DATA.routine[k]||[]).slice().sort((a,b)=>(a.t||"")<(b.t||"")?-1:1);
    const rows=slots.length?slots.map((s,idx)=>`<div class="slot"><span class="t">${esc(s.t||'--:--')}</span><span class="a">${esc(s.a||'')}</span><button class="x" onclick="delSlot('${k}',${idx})">✕</button></div>`).join(""):'<div class="slot" style="color:var(--muted)">Sem nada ainda</div>';
    return `<div class="day"><h3>${nome} <span style="font-size:11px;color:var(--muted);font-weight:600">${slots.length}</span></h3>
      ${rows}
      <div class="dayadd">
        <input class="time" type="time" id="rt-${k}">
        <input id="ra-${k}" placeholder="Atividade" onkeydown="if(event.key==='Enter')addSlot('${k}')">
        <button onclick="addSlot('${k}')">+</button>
      </div></div>`;
  }).join("");
}
function addSlot(k){
  const t=document.getElementById("rt-"+k).value, a=document.getElementById("ra-"+k).value.trim();
  if(!a){ return; }
  DATA.routine[k].push({t:t||"",a});
  persist(); renderRoutine();
}
function delSlot(k,idx){ const arr=DATA.routine[k]||[]; arr.splice(idx,1); persist(); renderRoutine(); }

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ----- login/boot -----
async function logout(){ try{ await _sb.auth.signOut(); }catch(e){} localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_KEY+"_owner"); location.href="index.html"; }
async function boot(){
  const {data:{session}}=await _sb.auth.getSession();
  if(!session){ location.href="index.html"; return; }
  buildNav(_sb,"tarefas");
  await hydrate();
  DATA=load(); normalize();
  document.getElementById("app").style.display="block";
  renderTasks();
}
boot();
</script>
</body>
</html>
