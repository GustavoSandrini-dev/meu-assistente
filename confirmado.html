<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta confirmada</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#12141c;color:#e8ebf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
.card{background:#1b1e28;border:1px solid #2e3342;border-radius:16px;padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.5)}
.emoji{font-size:54px;line-height:1}
h1{font-size:22px;margin:14px 0 8px}
p{color:#8a93a8;font-size:14px;line-height:1.5;margin:0 0 24px}
a.btn{display:inline-block;background:#4f7cf7;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:10px;transition:background .15s}
a.btn:hover{background:#3b66e0}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h1>Conta confirmada!</h1>
    <p>Seu e-mail foi confirmado com sucesso. Agora é só entrar com seu e-mail e senha pra começar a usar o assistente.</p>
    <a class="btn" href="index.html">Fazer login →</a>
  </div>
</body>
</html>
