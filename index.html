<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Assistente</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f7cf7">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
<style>
body[data-theme="claro"]{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#67728a;--border:#d8dfeb;--input:#fff;--accent:#4f7cf7;--accent-t:#fff;--neg:#c0392b}
body[data-theme="escuro"]{color-scheme:dark;--bg:#12151c;--card:#1c212b;--text:#e6eaf2;--muted:var(--muted);--border:#323a4a;--input:#151a23;--accent:#4f7cf7;--accent-t:#fff;--neg:var(--neg)}
body[data-theme="rosa"]{--bg:#fdf2f7;--card:#fff;--text:#3d2233;--muted:#a1738c;--border:#f3cfe0;--input:#fffafd;--accent:#e0559a;--accent-t:#fff;--neg:#c0392b}
body[data-theme="rosa-escuro"]{color-scheme:dark;--bg:#231018;--card:#321a26;--text:#fce7f3;--muted:#c48aa8;--border:#553046;--input:#281420;--accent:#f472b6;--accent-t:#3d0f28;--neg:var(--neg)}
body[data-theme="dracula"]{color-scheme:dark;--bg:#282a36;--card:#343746;--text:#f8f8f2;--muted:#8b90a8;--border:#4d5066;--input:#2c2e3c;--accent:#bd93f9;--accent-t:#22232e;--neg:#ff5555}
body[data-theme="nord"]{color-scheme:dark;--bg:#2e3440;--card:#3b4252;--text:#eceff4;--muted:#94a0b8;--border:#4c566a;--input:#333947;--accent:#88c0d0;--accent-t:#1d2530;--neg:#bf616a}
body[data-theme="solarizado"]{--bg:#fdf6e3;--card:#fffbf0;--text:#403a2e;--muted:#93a1a1;--border:#e6dcc0;--input:#fffdf5;--accent:#268bd2;--accent-t:#fff;--neg:#dc322f}
body[data-theme="oceano"]{color-scheme:dark;--bg:#0f1c2e;--card:#16283e;--text:#dcecfb;--muted:#7d95b3;--border:#2c4360;--input:#122238;--accent:#38bdf8;--accent-t:#08243a;--neg:#fb7185}
body[data-theme="floresta"]{color-scheme:dark;--bg:#14211a;--card:#1d2f25;--text:#e2f2e7;--muted:#84a390;--border:#33503f;--input:#182a20;--accent:#4ade80;--accent-t:#0c2415;--neg:#f87171}
body[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e6;--text:#43362a;--muted:#96866f;--border:#dfd0b4;--input:#fffaf0;--accent:#8b5e34;--accent-t:#fff8ec;--neg:#b3382c}
*{margin:0;padding:0;box-sizing:border-box}
.themeSel{font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;max-width:150px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:24px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
a.card,.card{position:relative;display:block;text-decoration:none;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px;color:var(--text);transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.rm{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer;opacity:0;transition:opacity .15s}
a.card:hover .rm{opacity:1}
.rm:hover{color:var(--neg);border-color:var(--neg)}
a.card.soon{opacity:.55;pointer-events:none}
.emoji{font-size:32px}
.ct{font-size:17px;font-weight:800;margin:10px 0 4px}
.cd{font-size:13px;color:var(--muted)}
.badge{font-size:10px;font-weight:700;background:var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.agenda{grid-column:1/-1;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px}
.agenda h2{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.agenda a{color:var(--accent);font-size:12px;text-decoration:none}
.slot{display:flex;gap:12px;padding:7px 0;font-size:14px;align-items:center}
.slot+.slot{border-top:1px dashed var(--border)}
.slot .t{color:var(--muted);font-size:12px;min-width:96px}
.slot .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.btn{background:none;border:1.5px solid var(--border);color:var(--muted);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer}
.foot{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
#ov{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center}
#ovbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px;max-width:92vw}
#ovbox input{width:100%;padding:11px;margin-bottom:12px;border:1.5px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);font-size:14px;outline:none}
#ovbox button{width:100%;padding:11px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-t);font-weight:700;font-size:14px;cursor:pointer}
#ovmsg{font-size:12px;margin-top:12px;min-height:16px;color:var(--neg)}
#tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--input);border-radius:10px;padding:4px}
#tabs button{flex:1;width:auto;background:none;color:var(--muted);padding:9px;font-size:13px;border-radius:7px}
#tabs button.tabsel{background:var(--accent);color:var(--accent-t)}
</style>
</head>
<body data-theme="escuro">
<div id="ov"><div id="ovbox">
  <div id="ovload" style="text-align:center;color:var(--muted);font-size:14px">Carregando…</div>
  <div id="ovform" style="display:none">
    <div id="tabs">
      <button id="tabLogin" class="tabsel" onclick="setMode('login')">Entrar</button>
      <button id="tabSignup" onclick="setMode('signup')">Criar conta</button>
    </div>
    <div id="s1">
      <div id="signupFields" style="display:none">
        <input id="nm" placeholder="Nome completo">
        <input id="ph" inputmode="tel" placeholder="Telefone / WhatsApp">
      </div>
      <input id="em" type="email" placeholder="Seu e-mail">
      <input id="pw" type="password" placeholder="Senha">
      <div id="pwHint" style="display:none;font-size:11px;color:var(--muted);margin:-6px 0 12px;line-height:1.4">Senha: mín. 8 caracteres, com maiúscula, minúscula, número e símbolo.</div>
      <button onclick="submitAuth()" id="sendBtn">Entrar</button>
    </div>
    <div id="ovmsg"></div>
  </div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <div><h1 id="hi">🚀 Meu Assistente</h1><p class="sub" id="sub">Bem-vindo de volta.</p></div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="themeSel" id="themeSel" onchange="setTheme(this.value)" title="Tema">
        <option value="claro">☀️ Claro</option><option value="escuro">🌙 Escuro</option>
        <option value="rosa">🌸 Rosa</option><option value="rosa-escuro">🌷 Rosa escuro</option>
        <option value="dracula">🧛 Drácula</option><option value="nord">❄️ Nord</option>
        <option value="solarizado">🌅 Solarizado</option><option value="oceano">🌊 Oceano</option>
        <option value="floresta">🌲 Floresta</option><option value="sepia">📜 Sépia</option>
      </select>
      <button class="btn" onclick="editName()">✏️ Nome</button><button class="btn" onclick="setPassword()">🔑 Senha</button><button class="btn" onclick="logout()">Sair</button></div>
  </div>
  <div class="grid" id="cards"></div>
  <p class="foot">Plataforma pessoal · dados protegidos por login · sincronizado via Supabase</p>
</div>

<script>
const SB_URL="https://ovpncggowjhualakjaug.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cG5jZ2dvd2podWFsYWtqYXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDI1MDIsImV4cCI6MjEwMDMxODUwMn0.yGWi4aWynDVhIEftBZcayGrbPxgqj93ckDua0zTr4zI";
const sb=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

// ----- tema compartilhado (com override por tela) -----
const PAGE="index";
function currentTheme(){ return localStorage.getItem("themeOverride_"+PAGE)||localStorage.getItem("assistTheme")||"escuro"; }
function applyTheme(){ const t=currentTheme(); document.body.dataset.theme=t; const s=document.getElementById("themeSel"); if(s) s.value=t; }
function setTheme(t){
  const all=confirm("Aplicar este tema em TODOS os módulos?\n\nOK = todos os módulos\nCancelar = só nesta tela");
  if(all){ localStorage.setItem("assistTheme",t); localStorage.removeItem("themeOverride_"+PAGE); }
  else { localStorage.setItem("themeOverride_"+PAGE,t); }
  document.body.dataset.theme=t;
}
applyTheme();

const MODULES={
  financeiro:{name:"Painel Financeiro",emoji:"💰",url:"painel-financeiro-web.html",desc:"Gastos, orçamento por grupo e importação de extrato/fatura."},
  jogos:{name:"Biblioteca de Jogos",emoji:"🎮",url:"biblioteca-jogos-web.html",desc:"Steam + Xbox, conquistas, ranking e metas."},
  filmes:{name:"Filmes & Séries",emoji:"🎬",url:"filmes-web.html",desc:"O que assistir, onde assistir e seu diário."},
  livros:{name:"Biblioteca de Livros",emoji:"📚",url:"livros-web.html",desc:"Leituras, tempo de leitura, avaliações e metas."},
  estudos:{name:"Estudos",emoji:"📖",url:"#",desc:"Matérias, cronograma de concurso e horas estudadas.",soon:true},
  tarefas:{name:"Tarefas & Rotina",emoji:"✅",url:"tarefas-web.html",desc:"Suas tarefas com prazos e prioridades, e sua rotina da semana."},
  saude:{name:"Vida Saudável",emoji:"🥗",url:"vida-saudavel-web.html",desc:"Cardápio, contador de calorias, água com lembrete e IMC."},
  habitos:{name:"Hábitos",emoji:"🔁",url:"#",desc:"Rotinas diárias, sequências e acompanhamento.",soon:true},
  notas:{name:"Notas",emoji:"📝",url:"#",desc:"Anotações rápidas e ideias.",soon:true},
  metas:{name:"Metas & Objetivos",emoji:"🎯",url:"#",desc:"Objetivos de curto e longo prazo.",soon:true}
};

// Agenda (rotina) — hoje. (Fase seguinte: rotina por usuário)
const DIA=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ROT={
  1:[["07:00 natação?","","#38bdf8"]],
  2:[["07:00–08:00","Natação","#38bdf8"],["08:30–17:30","Trabalho (+ academia 12h)","#5f6c7b"],["18:30–20:30","Estudo concurso","#ef4444"],["22:00–00:00","Jogos","#f59e0b"]],
  5:[["07:00–08:00","Natação","#38bdf8"],["08:30–17:30","Trabalho","#5f6c7b"],["18:30–20:30","Estudo concurso","#ef4444"],["22:00–00:00","Jogos","#f59e0b"]]
};
const ROT_DEF=[["08:30–17:30","Trabalho (+ academia 12h)","#5f6c7b"],["18:30–20:30","Estudo concurso","#ef4444"],["20:30–22:00","Projeto de vídeos","#a855f7"],["22:00–00:00","Jogos","#f59e0b"]];
const ROT_FDS=[["10:00–12:00","Vídeos","#a855f7"],["14:00–18:00","Jogos / amigos","#f59e0b"]];

let profile=null;

let SUPPRESS_LOGIN=false;
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) onLogin(); else showForm();
  sb.auth.onAuthStateChange((_e,s)=>{ if(SUPPRESS_LOGIN) return; if(s && document.getElementById("ov").style.display!=="none") onLogin(); });
}
function showForm(){ document.getElementById("ovload").style.display="none"; document.getElementById("ovform").style.display="block"; }
function amsg(t,ok){ const e=document.getElementById("ovmsg"); e.textContent=t; e.style.color=ok?"#3ecf9a":"var(--neg)"; }
let MODE="login";
function setMode(m){
  MODE=m;
  document.getElementById("tabLogin").classList.toggle("tabsel",m==="login");
  document.getElementById("tabSignup").classList.toggle("tabsel",m==="signup");
  document.getElementById("signupFields").style.display=m==="signup"?"block":"none";
  document.getElementById("pwHint").style.display=m==="signup"?"block":"none";
  document.getElementById("sendBtn").textContent=m==="signup"?"Cadastrar":"Entrar";
  amsg("");
}
function pwStrong(p){ return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p); }
async function submitAuth(){
  const email=document.getElementById("em").value.trim();
  const pw=document.getElementById("pw").value;
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){amsg("Digite um e-mail válido.");return;}

  // ---- CADASTRO: cria a conta e entra direto (sem aprovação) ----
  if(MODE==="signup"){
    const nome=document.getElementById("nm").value.trim();
    const fone=document.getElementById("ph").value.trim();
    if(!nome){amsg("Digite seu nome.");return;}
    if(fone.replace(/\D/g,"").length<10){amsg("Digite um telefone válido.");return;}
    if(!pwStrong(pw)){amsg("Senha fraca: mín. 8 caracteres, com maiúscula, minúscula, número e símbolo.");return;}
    window.__signup={nome,phone:fone};
    amsg("Criando conta…",true);
    try{
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:new URL("confirmado.html",location.href).href}});
      if(error){
        window.__signup=null;
        if(/already|registered|exists/i.test(error.message)) amsg("Esse e-mail já tem conta. Use a aba Entrar.");
        else amsg(error.message);
        return;
      }
      if(!data.session){
        // "Confirm email" está ligado: usuário criado, mas precisa confirmar o e-mail
        window.__signup=null;
        document.getElementById("ovform").innerHTML=
          '<div style="text-align:center">'
          +'<div style="font-size:42px;margin-bottom:8px">📧</div>'
          +'<div style="font-size:18px;font-weight:800;margin-bottom:8px">Conta criada!</div>'
          +'<div style="font-size:13px;color:var(--muted);margin-bottom:18px">Enviamos um link de confirmação pro seu e-mail. Confirme e depois volte pra entrar. 🙌</div>'
          +'<button onclick="location.reload()">Voltar ao login</button></div>';
        return;
      }
      // tem sessão (confirmação desligada) → onLogin() entra direto
    }catch(e){ window.__signup=null; console.error(e); amsg("Erro ao cadastrar: "+(e&&e.message?e.message:JSON.stringify(e))); }
    return;
  }

  // ---- LOGIN: e-mail + senha ----
  if(!pw){amsg("Digite sua senha.");return;}
  amsg("Entrando…",true);
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){
      console.error("login error:",error);
      amsg(/invalid|credentials/i.test(error.message)?"E-mail ou senha incorretos.":error.message);
      return;
    }
    // onAuthStateChange chama onLogin()
  }catch(e){ console.error(e); amsg("Erro: "+(e&&e.message?e.message:JSON.stringify(e))); }
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function setPassword(){
  const p=prompt("Defina uma senha (mín. 6 caracteres) pra entrar por e-mail + senha:");
  if(p===null) return;
  if(p.length<6){ alert("A senha precisa ter no mínimo 6 caracteres."); return; }
  const {error}=await sb.auth.updateUser({password:p});
  alert(error?("Erro: "+error.message):"Senha definida! Da próxima vez você entra com e-mail + senha. 🔑");
}
async function editName(){
  const novo=(prompt("Seu nome:", profile.name||"")||"").trim();
  if(!novo) return;
  const {data:{user}}=await sb.auth.getUser();
  await sb.from("profiles").update({name:novo, updated_at:new Date().toISOString()}).eq("user_id",user.id);
  profile.name=novo;
  document.getElementById("hi").textContent="Olá, "+novo+" 👋";
}

async function onLogin(){
  document.getElementById("ov").style.display="none";
  document.getElementById("app").style.display="block";
  const {data:{user}}=await sb.auth.getUser();
  // perfil (cria se não existir)
  let {data}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle();
  if(!data){
    const s=window.__signup||{};
    const sugestao=(user.email||"").split("@")[0];
    await sb.from("profiles").insert({name:s.nome||sugestao, phone:s.phone||null, modules:["financeiro","filmes"]});
    window.__signup=null;
    ({data}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle());
  }
  profile=data||{name:(user.email||"").split("@")[0],modules:["financeiro","filmes"]};
  document.getElementById("hi").textContent="Olá, "+(profile.name||"você")+" 👋";
  document.getElementById("sub").textContent=(profile.is_admin?"Admin · ":"")+"Escolha um módulo:";
  render();
}

async function addModule(k){
  const mods=profile.modules||["financeiro","jogos"];
  if(mods.includes(k)) return;
  mods.push(k); profile.modules=mods;
  const {data:{user}}=await sb.auth.getUser();
  await sb.from("profiles").update({modules:mods,updated_at:new Date().toISOString()}).eq("user_id",user.id);
  render();
}
async function removeModule(k){
  if(!confirm("Tirar este módulo da sua tela inicial?")) return;
  let mods=(profile.modules||[]).filter(x=>x!==k); profile.modules=mods;
  const {data:{user}}=await sb.auth.getUser();
  await sb.from("profiles").update({modules:mods,updated_at:new Date().toISOString()}).eq("user_id",user.id);
  render();
}
function render(){
  const mods=profile.modules||["financeiro","jogos"];
  let html="";
  mods.forEach(k=>{ const m=MODULES[k]; if(!m)return;
    html+=`<a class="card ${m.soon?'soon':''}" href="${m.soon?'#':m.url}">
      <div class="emoji">${m.emoji}</div>
      <div class="ct">${m.name}${m.soon?'<span class="badge">em breve</span>':''}</div>
      <div class="cd">${m.desc}</div>
      <button class="rm" onclick="event.preventDefault();event.stopPropagation();removeModule('${k}')" title="Remover da tela">✕</button></a>`;
  });
  // card para adicionar módulos — sempre visível
  const prontos=Object.keys(MODULES).filter(k=>!mods.includes(k)&&!MODULES[k].soon);
  const embreve=Object.keys(MODULES).filter(k=>!mods.includes(k)&&MODULES[k].soon);
  html+=`<div class="card" style="border-style:dashed">
    <div class="emoji">➕</div><div class="ct">Adicionar módulo</div>`;
  if(prontos.length){
    html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${
      prontos.map(k=>`<button class="btn" onclick="addModule('${k}')">${MODULES[k].emoji} ${MODULES[k].name}</button>`).join("")
    }</div>`;
  }
  if(embreve.length){
    html+=`<div class="cd" style="margin-top:12px;margin-bottom:6px">Em breve:</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${
        embreve.map(k=>`<span class="badge" style="font-size:11px">${MODULES[k].emoji} ${MODULES[k].name}</span>`).join("")
      }</div>`;
  }
  if(!prontos.length&&!embreve.length){ html+=`<div class="cd" style="margin-top:10px">Todos os módulos já estão na sua tela. 🎉</div>`; }
  html+=`</div>`;
  // card da agenda — só o dono (admin) vê a rotina fixa; cada usuário tem a sua (por enquanto só a do admin existe)
  if(profile.is_admin){
    const d=new Date().getDay();
    let blocks = ROT[d] || (d===0||d===6 ? ROT_FDS : ROT_DEF);
    if(d===2||d===5) blocks=ROT[d];
    const ag=blocks.map(b=>`<div class="slot"><span class="dot" style="background:${b[2]||'var(--accent)'}"></span><span class="t">${b[0]}</span><span>${b[1]}</span></div>`).join("");
    html+=`<div class="agenda">
      <h2>🗓️ Agenda de hoje — ${DIA[d]} <a href="https://calendar.google.com/calendar/r/day" target="_blank">Abrir Google Agenda ↗</a></h2>
      ${ag||'<div class="cd">Dia livre.</div>'}
    </div>`;
  }
  document.getElementById("cards").innerHTML=html;
}

initAuth();
</script>
</body>
</html>
