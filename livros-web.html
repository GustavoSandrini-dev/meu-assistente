body[data-theme="claro"]{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#67728a;--label:#4a5568;--border:#d8dfeb;--row:#eef1f7;--head:#e6eaf2;--input:#fff;--accent:#4f7cf7;--accent-h:#3b66e0;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(20,30,60,.07)}
body[data-theme="escuro"]{color-scheme:dark;--bg:#12151c;--card:#1c212b;--text:#e6eaf2;--muted:#8a93a8;--label:#aab3c5;--border:#323a4a;--row:#272e3b;--head:#323a4a;--input:#151a23;--accent:#4f7cf7;--accent-h:#6b90f9;--accent-t:#fff;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="rosa"]{--bg:#fdf2f7;--card:#fff;--text:#3d2233;--muted:#a1738c;--label:#7c4a63;--border:#f3cfe0;--row:#fae8f1;--head:#f3cfe0;--input:#fffafd;--accent:#e0559a;--accent-h:#c93f85;--accent-t:#fff;--pos:#0d8a62;--neg:#c0392b;--shadow:0 1px 4px rgba(160,60,110,.10)}
body[data-theme="rosa-escuro"]{color-scheme:dark;--bg:#231018;--card:#321a26;--text:#fce7f3;--muted:#c48aa8;--label:#e3aec9;--border:#553046;--row:#40222f;--head:#553046;--input:#281420;--accent:#f472b6;--accent-h:#f88fc6;--accent-t:#3d0f28;--pos:#3ecf9a;--neg:#f07567;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="dracula"]{color-scheme:dark;--bg:#282a36;--card:#343746;--text:#f8f8f2;--muted:#8b90a8;--label:#bdc0d4;--border:#4d5066;--row:#3d4054;--head:#4d5066;--input:#2c2e3c;--accent:#bd93f9;--accent-h:#cba6fb;--accent-t:#22232e;--pos:#50fa7b;--neg:#ff5555;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="nord"]{color-scheme:dark;--bg:#2e3440;--card:#3b4252;--text:#eceff4;--muted:#94a0b8;--label:#c2cbdc;--border:#4c566a;--row:#434c5e;--head:#4c566a;--input:#333947;--accent:#88c0d0;--accent-h:#9fd0de;--accent-t:#1d2530;--pos:#a3be8c;--neg:#bf616a;--shadow:0 1px 6px rgba(0,0,0,.35)}
body[data-theme="solarizado"]{--bg:#fdf6e3;--card:#fffbf0;--text:#403a2e;--muted:#93a1a1;--label:#657b83;--border:#e6dcc0;--row:#f3ecd7;--head:#e6dcc0;--input:#fffdf5;--accent:#268bd2;--accent-h:#1c76b6;--accent-t:#fff;--pos:#859900;--neg:#dc322f;--shadow:0 1px 4px rgba(120,100,50,.10)}
body[data-theme="oceano"]{color-scheme:dark;--bg:#0f1c2e;--card:#16283e;--text:#dcecfb;--muted:#7d95b3;--label:#a8c0dc;--border:#2c4360;--row:#1d3350;--head:#2c4360;--input:#122238;--accent:#38bdf8;--accent-h:#5ecafa;--accent-t:#08243a;--pos:#34d399;--neg:#fb7185;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="floresta"]{color-scheme:dark;--bg:#14211a;--card:#1d2f25;--text:#e2f2e7;--muted:#84a390;--label:#aecbb8;--border:#33503f;--row:#243c2f;--head:#33503f;--input:#182a20;--accent:#4ade80;--accent-h:#6ee79a;--accent-t:#0c2415;--pos:#4ade80;--neg:#f87171;--shadow:0 1px 6px rgba(0,0,0,.4)}
body[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e6;--text:#43362a;--muted:#96866f;--label:#6e5c46;--border:#dfd0b4;--row:#efe5cd;--head:#dfd0b4;--input:#fffaf0;--accent:#8b5e34;--accent-h:#75492a;--accent-t:#fff8ec;--pos:#3f7d3a;--neg:#b3382c;--shadow:0 1px 4px rgba(110,80,40,.12)}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);background-image:radial-gradient(rgba(128,128,128,.13) 1.1px, transparent 1.1px);background-size:22px 22px;color:var(--text);min-height:100vh;padding:24px 32px}
.wrap{max-width:1400px;margin:0 auto}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.nav a,.nav button,.nav select{text-decoration:none;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.nav a.act{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
#themeSel{flex:0 0 auto;width:auto;max-width:150px}
h1{font-size:22px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.goal{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.goal .gt{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:8px}
.goal .gt button{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.gbar{height:10px;background:var(--row);border-radius:6px;overflow:hidden}
.gbar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .sv{font-size:24px;font-weight:800;color:var(--accent)}
.stat .sl{font-size:12px;color:var(--muted);margin-top:2px}
.charts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr}}
.chartcard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.chartcard .ch-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;text-align:center}
.chartcard canvas{max-height:190px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.pill{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.act{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.pill.add{border-style:dashed;color:var(--muted)}
.pill .sh{font-size:10px;opacity:.8;margin-left:4px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;position:relative}
.bar input{flex:1;min-width:200px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:14px;outline:none}
.bar input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-t);border:none;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;max-height:66vh;overflow:auto;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.drow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow img{width:38px;height:56px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--row)}
.dr-noimg{width:38px;height:56px;background:var(--row);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dr-info{flex:1;min-width:0}
.dr-t{font-size:14px;font-weight:700}
.dr-y{font-size:12px;color:var(--muted)}
.dr-add{background:var(--accent);color:var(--accent-t);border:none;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dr-add.in{background:var(--row);color:var(--muted)}
.dr-msg{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.chip.act{background:var(--row);color:var(--text)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
@media(min-width:1100px){#items.grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}}
.libtabs{display:flex;gap:8px;margin-bottom:12px}
.libtab{flex:0 0 auto;padding:9px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer}
.libtab.act{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.where{display:flex;gap:6px;flex-wrap:wrap}
.where a{font-size:11px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.where a:hover{border-color:var(--accent)}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cardwrap{position:relative;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--row);display:block}
.noimg{width:100%;aspect-ratio:2/3;background:var(--row);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted)}
.rankbadge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-t);font-size:16px;font-weight:800;padding:3px 10px;border-radius:9px}
.st{position:absolute;bottom:8px;left:8px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.st.quero{background:#3a4152;color:#c9d0de}.st.lendo{background:#1e5b7a;color:#8fd4ff}.st.lido{background:#1e7a4d;color:#8affc0}
.cb{padding:9px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.tt{font-size:14px;font-weight:700;line-height:1.2}
.au{font-size:12px;color:var(--muted)}
.rowb{display:flex;gap:6px;align-items:center}
select,.note,.cmt{background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:6px;font-size:12px}
select{flex:1}
.note{width:48px;flex:0 0 48px;text-align:center}
.raterow{display:flex;align-items:center;gap:8px}
.raterow .ratelbl{font-size:11px;color:var(--muted);font-weight:600}
.stars{display:inline-block;position:relative;font-size:16px;line-height:1;letter-spacing:2px;vertical-align:middle;white-space:nowrap;flex:0 0 auto}
.stars .bg{color:var(--border)}
.stars .fg{position:absolute;left:0;top:0;color:#f5b301;overflow:hidden;white-space:nowrap}
.cmt{width:100%;font-family:inherit;resize:vertical;min-height:34px;outline:none}
.dates{display:flex;flex-direction:column;gap:8px;background:var(--row);border-radius:8px;padding:9px;font-size:11px;color:var(--muted);margin-top:2px}
.dates .drow{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0;border-bottom:none}
.dates .drow span{font-size:11px;font-weight:600}
.dates input[type=date]{width:100%;min-width:0;box-sizing:border-box;background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-size:11px}
.dates b{font-size:11px;color:var(--text)}
.dates .drow span{min-width:64px}
.dates input{flex:1;background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:13px}
.dates b{color:var(--pos);text-align:center}
.ffilter{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:16px;padding:6px 10px;font-size:12px;font-weight:600}
.mini{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px}
.mini:hover{color:var(--neg)}
.empty{color:var(--muted);font-size:14px;padding:30px;text-align:center}
/* login */
#ov{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center}
#ovbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px;max-width:92vw}
#ovbox input{width:100%;padding:11px;margin-bottom:12px;border:1.5px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);font-size:14px;outline:none}
#ovbox button{width:100%;padding:11px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-t);font-weight:700;font-size:14px;cursor:pointer}
#ovmsg{font-size:12px;margin-top:12px;min-height:16px;color:var(--neg)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
#modalbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:380px;max-width:94vw}
#modalbox h3{font-size:16px;margin-bottom:14px}
#modalbox input,#modalbox select{width:100%;padding:10px;margin-bottom:12px;border:1.5px solid var(--border);border-radius:9px;background:var(--input);color:var(--text);font-size:14px}
#modalbox label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
</style>
</head>
<body data-theme="escuro">

<div id="ov"><div id="ovbox">
  <div id="ovload" style="text-align:center;color:var(--muted);font-size:14px">Carregando…</div>
  <div id="ovform" style="display:none">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">🔒 Entrar</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px">Acesse sua biblioteca.</div>
    <input id="em" type="email" placeholder="E-mail">
    <input id="pw" type="password" placeholder="Senha">
    <button onclick="doLogin()">Entrar</button>
    <div id="ovmsg"></div>
  </div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="nav">
    <span id="navLinks" style="display:contents"><a href="index.html">🏠 Início</a></span>
    <button onclick="pickGoodreads()" style="margin-left:auto">📥 Goodreads</button>
    <select id="themeSel" onchange="setTheme(this.value)" title="Tema">
      <option value="claro">☀️ Claro</option><option value="escuro">🌙 Escuro</option>
      <option value="rosa">🌸 Rosa</option><option value="rosa-escuro">🌷 Rosa escuro</option>
      <option value="dracula">🧛 Drácula</option><option value="nord">❄️ Nord</option>
      <option value="solarizado">🌅 Solarizado</option><option value="oceano">🌊 Oceano</option>
      <option value="floresta">🌲 Floresta</option><option value="sepia">📜 Sépia</option>
    </select>
    <button onclick="logout()">Sair</button>
  </div>
  <input type="file" id="grFile" accept=".csv" style="display:none" onchange="importGoodreads(event)">
  <h1>📚 Biblioteca de Livros</h1>
  <div class="sub">Leituras, avaliações e metas. Busca no Google Books (por título, autor ou ISBN).</div>

  <div class="pills" id="pills"></div>
  <div id="shareRow" style="margin-bottom:14px;display:none"></div>

  <div class="bar">
    <input id="q" placeholder="Buscar livro… (ex: O Hobbit)" oninput="debSearch()" autocomplete="off">
    <button class="btn ghost" onclick="clearSearch()">Limpar</button>
    <button class="btn ghost" onclick="manualModal()">➕ Manual</button>
    <button class="btn ghost" onclick="bulkModal()">📋 Lista</button>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="libtabs" id="libtabs" style="display:none">
    <span class="libtab act" data-t="biblio" onclick="setTab('biblio')">📚 Minha biblioteca</span>
    <span class="libtab" data-t="stats" onclick="setTab('stats')">📊 Estatísticas</span>
  </div>
  <div id="statsView" style="display:none">
    <div class="goal" id="goalBox"></div>
    <div id="statsBox"></div>
  </div>
  <div class="filters" id="filters" style="display:none">
    <span class="chip act" data-f="todos" onclick="setFilter('todos')">Todos</span>
    <span class="chip" data-f="quero" onclick="setFilter('quero')">⭐ Lista de desejos</span>
    <span class="chip" data-f="lendo" onclick="setFilter('lendo')">📖 Lendo</span>
    <span class="chip" data-f="lido" onclick="setFilter('lido')">✅ Lido</span>
    <select id="fGenre" class="ffilter" onchange="FGENRE=this.value;renderItems()"><option value="">Todos os gêneros</option></select>
    <select id="fAuthor" class="ffilter" onchange="FAUTHOR=this.value;renderItems()"><option value="">Todos os autores</option></select>
    <span class="chip" data-f="ranking" onclick="setFilter('ranking')" style="margin-left:auto">🏆 Ranking</span>
  </div>
  <div class="sec-title" id="listTitle" style="display:none">📁 Minha estante</div>
  <div class="grid" id="items"></div>

  <div id="recs"></div>
</div>

<div id="modal"><div id="modalbox"></div></div>

<script>
const SB_URL="https://ovpncggowjhualakjaug.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cG5jZ2dvd2podWFsYWtqYXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDI1MDIsImV4cCI6MjEwMDMxODUwMn0.yGWi4aWynDVhIEftBZcayGrbPxgqj93ckDua0zTr4zI";
const sb=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const IMG="https://books.google.com";
const GBKEY="AIzaSyBcBDhVNjV_Joecv1kfsq6R90BuRLfqeY4";
const GBK="&key="+GBKEY;
const CSE="e6f02571c42bc4c16"; // Google Custom Search (busca web de capas)
const CSEKEY="AIzaSyBdFTcI9zzUwikn0mtraL5eZ09tQUKnb_s"; // chave dedicada à Custom Search

// ----- tema (compartilhado com todos os módulos; pode ter override por tela) -----
const PAGE="livros";
function currentTheme(){ return localStorage.getItem("themeOverride_"+PAGE)||localStorage.getItem("assistTheme")||"escuro"; }
function applyTheme(){ const t=currentTheme(); document.body.dataset.theme=t; const s=document.getElementById("themeSel"); if(s) s.value=t; }
function setTheme(t){
  const all=confirm("Aplicar este tema em TODOS os módulos?\n\nOK = todos os módulos\nCancelar = só nesta tela");
  if(all){ localStorage.setItem("assistTheme",t); localStorage.removeItem("themeOverride_"+PAGE); }
  else { localStorage.setItem("themeOverride_"+PAGE,t); }
  document.body.dataset.theme=t;
}
applyTheme();

let ME=null, COLS=[], ACTIVE=null, ITEMS=[], FILTER="todos", LIB_TAB="biblio";
function setTab(t){
  LIB_TAB=t;
  document.querySelectorAll("#libtabs .libtab").forEach(x=>x.classList.toggle("act",x.dataset.t===t));
  const stats = t==="stats";
  document.getElementById("statsView").style.display = stats ? "block" : "none";
  document.getElementById("filters").style.display=(ITEMS.length && !stats)?"flex":"none";
  document.getElementById("items").style.display = stats ? "none" : "grid";
  const rec=document.getElementById("recs"); if(rec) rec.style.display = stats ? "none" : "block";
  const lt=document.getElementById("listTitle"); if(lt) lt.style.display = stats ? "none" : (ITEMS.length?"block":"none");
  if(!stats) renderItems();
}
let GOAL=parseInt(localStorage.getItem("livrosGoal")||"12",10);

// ---------- login (e-mail + senha) ----------
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) onLogin(); else location.href="index.html";
  sb.auth.onAuthStateChange((_e,s)=>{ if(s && document.getElementById("ov").style.display!=="none") onLogin(); });
}
function showForm(){ document.getElementById("ovload").style.display="none"; document.getElementById("ovform").style.display="block"; }
function amsg(t){ document.getElementById("ovmsg").textContent=t; }
async function doLogin(){
  const email=document.getElementById("em").value.trim(), pw=document.getElementById("pw").value;
  if(!email||!pw){amsg("Preencha e-mail e senha.");return;}
  amsg("Entrando…");

// converte notas antigas (0-10) para estrelas (0-5), uma vez por livro (flag no meta)
async function migrateStars(){
  for(const i of ITEMS){
    const m=i.meta||{};
    if(i.rating!=null && !m.starScale){
      const novo=Math.round((i.rating/2)*10)/10;
      const nm=Object.assign({},m,{starScale:true});
      i.rating=novo; i.meta=nm;
      await sb.from("items").update({rating:novo,meta:nm}).eq("id",i.id);
    } else if(i.rating==null && !m.starScale){
      const nm=Object.assign({},m,{starScale:true}); i.meta=nm;
      await sb.from("items").update({meta:nm}).eq("id",i.id);
    }
  }
}

  const topN=(o,n)=>{ const ks=Object.keys(o).sort((a,b)=>o[b]-o[a]); const t=ks.slice(0,n); const rest=ks.slice(n).reduce((s,x)=>s+o[x],0); const labels=t.slice(),data=t.map(x=>o[x]); if(rest){labels.push("Outros");data.push(rest);} return {labels,data}; };

    </div>
    <div class="charts-grid">

      <div class="chartcard"><div class="ch-t">Autores</div><canvas id="chAut"></canvas></div>
      <div class="chartcard"><div class="ch-t">Editoras</div><canvas id="chEdt"></canvas></div>
    </div>

  Object.values(CHARTS).forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS={};

  CHARTS.read=dough('chRead',['Lidos','Não lidos'],[lidos.length,ITEMS.length-lidos.length],['#3ecf9a','#4d5566'],(e,el)=>{ if(el.length) setFilter(el[0].index===0?'lido':'todos'); });
  CHARTS.aut=dough('chAut',A.labels,A.data,pal,(e,el)=>{ if(!el.length)return; const l=A.labels[el[0].index]; if(l==='Outros')return; FAUTHOR=(FAUTHOR===l)?'':l; FGENRE=''; const s=document.getElementById('fAuthor'); if(s)s.value=FAUTHOR; setFilter('todos'); });

}

// capa em alta resolução do Google Books (zoom=0 traz a versão grande; tira o efeito de página dobrada)
function hiResUrl(u){ return u?u.replace("http://","https://").replace(/&edge=curl/,"").replace(/zoom=\d+/,"zoom=0"):""; }
function hiRes(il){ return hiResUrl((il&&(il.thumbnail||il.smallThumbnail))||""); }
function gbMap(v){ const vi=v.volumeInfo||{}; return {id:v.id,title:vi.title||"",authors:(vi.authors||[]).join(", "),yr:(vi.publishedDate||"").slice(0,4),poster:hiRes(vi.imageLinks),pages:vi.pageCount||0,genre:(vi.categories||[])[0]||"",publisher:vi.publisher||"",lang:vi.language||""}; }
async function fetchOne(t,a){
  try{
    const q=`intitle:"${t}" inauthor:"${a}"`;
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&langRestrict=pt&country=BR&maxResults=3${GBK}`);
    const d=await r.json();
    const bad=/an[áa]lise|resumo|guia de estudo|summary|study guide|s[ií]ntese/i;
    let v=(d.items||[]).find(x=>{ const vt=(x.volumeInfo&&x.volumeInfo.title)||""; return !bad.test(vt); }) || (d.items||[])[0];
    if(!v) return null;
    const b=gbMap(v); if(!b.title) return null; if(!b.authors) b.authors=a; return b;
  }catch(e){ return null; }
}

  ["Os Maias","Eça de Queirós"],["O Primo Basílio","Eça de Queirós"],
  ["Livro do Desassossego","Fernando Pessoa"],["Triste Fim de Policarpo Quaresma","Lima Barreto"],
  ["Olhos d'Água","Conceição Evaristo"],["A Culpa é das Estrelas","John Green"],
  ["Harry Potter e a Pedra Filosofal","J.K. Rowling"],["O Senhor dos Anéis","J.R.R. Tolkien"],
  ["O Hobbit","J.R.R. Tolkien"],["1984","George Orwell"],

async function melhores(){
  const cache=localStorage.getItem("recs50v1");
  if(cache){ try{ const a=JSON.parse(cache); if(a&&a.length) return a; }catch(e){} }
  const res=await Promise.all(CURADOS.map(([t,a])=>fetchOne(t,a)));
  const out=res.filter(b=>b&&b.title);
  if(out.length) localStorage.setItem("recs50v1",JSON.stringify(out));
  return out;
}
async function porAutor(){
  const aut={}; ITEMS.forEach(i=>{ const a=((i.meta&&i.meta.authors)||"").split(",")[0].trim(); if(a) aut[a]=(aut[a]||0)+1; });
  const top=Object.keys(aut).sort((a,b)=>aut[b]-aut[a]).slice(0,3);
  let out=[];
  for(const a of top){
    try{
      const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=inauthor:${encodeURIComponent('"'+a+'"')}&langRestrict=pt&country=BR&maxResults=20${GBK}`);
      const d=await r.json();
      (d.items||[]).map(gbMap).forEach(b=>{ if(String(b.lang).startsWith("pt") && b.title) out.push(b); });
    }catch(e){}
  }
  return out;
}
async function showRecs(){
  const box=document.getElementById("recs"); if(!box) return;
  const temAutor=ITEMS.some(i=>((i.meta&&i.meta.authors)||"").trim());
  box.innerHTML='<div class="sec-title">'+(temAutor?'✨ Recomendados pra você':'⭐ Top 10 pra começar')+'</div><div class="empty">Carregando…</div>';
  let fonte = temAutor ? await porAutor() : [];
  if(!fonte.length) fonte = await melhores();
  const shelf=new Set(ITEMS.map(i=>normTitle(i.title)));
  const seen=new Set(), recs=[];
  fonte.forEach(b=>{ const nt=normTitle(b.title); if(!b.title||shelf.has(nt)||seen.has(nt)) return; seen.add(nt); recs.push(b); });
  const final=recs.slice(0,10);
  const titulo=temAutor?"✨ Recomendados — mais dos autores que você lê":"⭐ Top 10 pra começar";
  box.innerHTML=`<div class="sec-title">${titulo}</div>`+(final.length?`<div class="grid">${final.map(recCard).join("")}</div>`:`<div class="empty">Não consegui carregar agora. Recarregue a página. 📚</div>`);
}

let FGENRE="", FAUTHOR="", FPUB="", FYEAR="";
function genreKey(i){ return (((i.meta&&i.meta.genre)||"").split("/")[0].trim())||""; }
function authorKey(i){ return (((i.meta&&i.meta.authors)||"").split(",")[0].trim())||""; }

// ---------- datas de leitura ----------
function daysBetween(a,b){ if(!a||!b) return null; const d=Math.round((Date.parse(b)-Date.parse(a))/86400000); return d>=0?d:null; }
function datesBlock(i){
  const m=i.meta||{}, st=i.status||"quero";
  if(st==="quero") return "";
  if(st==="lendo") return `<div class="dates"><div class="drow"><span>📖 Comecei</span><input type="date" value="${m.startDate||''}" onchange="setDate('${i.id}','start',this.value)"></div></div>`;
  const dias=daysBetween(m.startDate, m.endDate||i.done_date);
  return `<div class="dates">
    <div class="drow"><span>📖 Início</span><input type="date" value="${m.startDate||''}" onchange="setDate('${i.id}','start',this.value)"></div>
    <div class="drow"><span>✅ Fim</span><input type="date" value="${m.endDate||i.done_date||''}" onchange="setDate('${i.id}','end',this.value)"></div>
    ${dias!=null?`<b>⏱️ ${dias===0?'lido no mesmo dia':dias+' dia'+(dias>1?'s':'')}</b>`:''}</div>`;
}
function toggleDates(id){ const d=document.getElementById("dw-"+id); if(d) d.style.display=d.style.display==="none"?"block":"none"; }
async function setDate(id,which,val){
  const i=ITEMS.find(x=>x.id===id); if(!i) return; const m=Object.assign({},i.meta||{});
  if(which==="start") m.startDate=val||null; else m.endDate=val||null;

const STLBL={quero:"Quero ler",lendo:"Lendo",lido:"Lido"};
function renderItems(){
  const box=document.getElementById("items");
  if(FILTER==="ranking" && LIB_TAB==="biblio"){
    const ranked=ITEMS.filter(i=>i.rating!=null).sort((a,b)=>b.rating-a.rating);
    if(!ranked.length){ box.innerHTML='<div class="empty">Dê notas aos livros pra montar o ranking. 🏆</div>'; return; }
    box.innerHTML=ranked.map((i,idx)=>bookCard(i,idx+1)).join(""); return;
  }
  // "Todos" mostra tudo (lista de desejos + lendo + lido); os chips filtram por status
  let list = FILTER==="todos" ? ITEMS.slice() : ITEMS.filter(i=>(i.status||"quero")===FILTER);
  if(FGENRE) list=list.filter(i=>genreKey(i)===FGENRE);
  if(FAUTHOR) list=list.filter(i=>authorKey(i)===FAUTHOR);
  if(FPUB) list=list.filter(i=>((i.meta&&i.meta.publisher)||"").split(",")[0].trim()===FPUB);
  if(FYEAR) list=list.filter(i=>(i.done_date||"").slice(0,4)===FYEAR);
  if(!list.length){ box.innerHTML='<div class="empty">Nenhum livro aqui ainda. 📚</div>'; return; }
  box.innerHTML=list.map(i=>bookCard(i)).join("");
}
function medal(n){ return n===1?"🥇":n===2?"🥈":n===3?"🥉":"#"+n; }
function starsHTML(v){ v=Math.max(0,Math.min(5,v||0)); return `<span class="stars" title="${v} de 5"><span class="bg">★★★★★</span><span class="fg" style="width:${v/5*100}%">★★★★★</span></span>`; }
function bookCard(i,rank){

  const cover=i.poster?`<img src="${hiResUrl(i.poster)}" loading="lazy" onerror="imgFail(this)">`:`<div class="noimg">📖</div>`;

  const rankB=rank?`<span class="rankbadge">${medal(rank)}${i.rating!=null?' · '+i.rating:''}</span>`:"";
  return `<div class="card"><div class="cardwrap">
    ${cover}${rankB}<span class="st ${st}">${STLBL[st]||st}</span></div>
    <div class="cb">
      <div class="tt">${esc(i.title)}</div>
      <div class="au">${esc(m.authors||"")}${m.pages?" · "+m.pages+" pág":""}${m.format?" · "+esc(m.format):""}</div>
      <div class="rowb">
        <select style="flex:1" onchange="setStatus('${i.id}',this.value)">
          <option value="quero" ${st==="quero"?"selected":""}>Quero ler</option>
          <option value="lendo" ${st==="lendo"?"selected":""}>Lendo</option>
          <option value="lido" ${st==="lido"?"selected":""}>Lido</option>
        </select>

        ${i.rating!=null?starsHTML(i.rating):'<span class="stars"><span class="bg">★★★★★</span></span>'}
      </div>
      <textarea class="cmt" placeholder="Comentário…" onchange="setNote('${i.id}',this.value)">${esc(i.note||"")}</textarea>
      <div class="where" id="wh-${i.id}"></div>
      <div class="rowb" style="justify-content:space-between;flex-wrap:wrap">
        ${st!=="quero"?`<button class="mini" onclick="toggleDates('${i.id}')">📅 Datas</button>`:""}
        ${String(i.ext_id||"").startsWith("manual:")?`<button class="mini" onclick="editManual('${i.id}')">✏️ Editar</button>`:""}
        <button class="mini" onclick="showWhere('${i.id}')">📖 Onde ler</button>
        <button class="mini" onclick="delItem('${i.id}')">remover</button>
      </div>
    </div></div>`;
}
async function setStatus(id,v){
  const i=ITEMS.find(x=>x.id===id); const upd={status:v,updated_at:new Date().toISOString()};
  const m=Object.assign({},i.meta||{});
  const today=new Date().toISOString().slice(0,10);
  if(v==="lendo" && !m.startDate) m.startDate=today;
  if(v==="lido"){ if(!m.startDate) m.startDate=today; if(!m.endDate) m.endDate=today; upd.done_date=m.endDate; }
  upd.meta=m;
  await sb.from("items").update(upd).eq("id",id);
  if(i){ i.status=v; i.meta=m; if(v==="lido") i.done_date=upd.done_date; }
  renderGoal(); renderStats(); renderItems();
}
async function setRating(id,v){ const n=v===""?null:Math.max(0,Math.min(5,parseFloat(v))); await sb.from("items").update({rating:n,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.rating=n; renderItems(); }
async function setNote(id,v){ const t=v.trim()||null; await sb.from("items").update({note:t,updated_at:new Date().toISOString()}).eq("id",id); const it=ITEMS.find(i=>i.id===id); if(it)it.note=t; }
async function delItem(id){ if(!confirm("Remover da estante?"))return; await sb.from("items").delete().eq("id",id); ITEMS=ITEMS.filter(i=>i.id!==id); renderGoal(); renderItems(); }
function showWhere(id){
  const i=ITEMS.find(x=>x.id===id); if(!i) return;
  const box=document.getElementById("wh-"+id); if(!box) return;

async function searchGoogle(q,isbn){
  try{
    const query=isbn?("isbn:"+isbn):q;
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=20&langRestrict=pt&country=BR${GBK}`);
    const d=await r.json();
    return (d.items||[]).map(v=>{const vi=v.volumeInfo||{}; return {id:v.id,title:vi.title||"—",authors:(vi.authors||[]).join(", "),yr:(vi.publishedDate||"").slice(0,4),poster:hiRes(vi.imageLinks),pages:vi.pageCount||0,genre:(vi.categories||[])[0]||"",publisher:vi.publisher||""};});
  }catch(e){ return []; }
}
function normTitle(t){ return String(t||"").toLowerCase().split(/[:\(\-–]/)[0].replace(/[^a-z0-9à-ú ]/gi,"").replace(/\s+/g," ").trim(); }
async function searchOpenLib(q,isbn){
  try{
    const url=isbn?`https://openlibrary.org/search.json?isbn=${isbn}&limit=5&fields=key,title,author_name,first_publish_year,cover_i,number_of_pages_median`
                  :`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=key,title,author_name,first_publish_year,cover_i,number_of_pages_median`;
    const r=await fetch(url); const d=await r.json();
    return (d.docs||[]).map(x=>({id:"ol:"+String(x.key||"").replace("/works/",""),title:x.title||"—",authors:(x.author_name||[]).join(", "),yr:x.first_publish_year?String(x.first_publish_year):"",poster:x.cover_i?`https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg`:"",pages:x.number_of_pages_median||0}));
  }catch(e){ return []; }
}
async function doSearch(){
  const raw=document.getElementById("q").value.trim();
  if(raw.length<2){ hideDropdown(); return; }
  dd().style.display="block"; dd().innerHTML='<div class="dr-msg">Buscando…</div>';
  const clean=raw.replace(/[-\s]/g,"");
  const isbn=/^\d{9}[\dXx]$|^\d{13}$/.test(clean)?clean:null;
  const gb=await searchGoogle(raw,isbn);
  if(document.getElementById("q").value.trim()!==raw) return;
  // junta sem repetir por título (ignorando subtítulo/edição), priorizando quem tem capa
  const seen=new Map();
  gb.forEach(b=>{
    const k=normTitle(b.title)+"|"+(b.authors||"").toLowerCase().split(",")[0].trim();
    const cur=seen.get(k);
    if(!cur || (!cur.poster && b.poster)) seen.set(k,b);
  });
  const all=[...seen.values()];
  if(!all.length){ dd().innerHTML=`<div class="dr-msg">Nada encontrado.<br><button class="btn" style="margin-top:8px" onclick="manualModal()">➕ Adicionar "${esc(raw)}" manualmente</button></div>`; return; }
  dd().innerHTML=all.slice(0,15).map(dropRow).join("")+`<div style="padding:10px;text-align:center;border-top:1px solid var(--border)"><button class="btn ghost" onclick="manualModal()">➕ Não achou? Adicionar manualmente</button></div>`;
}

// de/para: acha o livro no Google Books (pelo ISBN, senão título+autor)
async function gbLookup(isbn,title,author){
  const tryQ=async(q)=>{ try{ const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&langRestrict=pt&country=BR&maxResults=1${GBK}`); const d=await r.json(); const v=(d.items||[])[0]; return v?gbMap(v):null; }catch(e){ return null; } };
  let b=null;
  if(title) b=await tryQ(`intitle:"${title}" inauthor:"${author}"`);   // prioriza edição em português
  if(!b && isbn) b=await tryQ(`isbn:${isbn}`);
  return b;
}
async function importGoodreads(ev){
  const file=ev.target.files[0]; if(!file) return;
  const text=await file.text(); ev.target.value="";
  const parsed=Papa.parse(text,{header:true,skipEmptyLines:true});
  const rows=parsed.data||[];
  const existing=new Set(ITEMS.map(i=>normTitle(i.title)));
  const base=[]; let skip=0;
  rows.forEach(r=>{
    const title=(r["Title"]||"").trim(); if(!title) return;
    if(existing.has(normTitle(title))){ skip++; return; }
    const shelf=(r["Exclusive Shelf"]||"").trim();
    const status=shelf==="read"?"lido":shelf==="currently-reading"?"lendo":"quero";
    const mr=parseInt(r["My Rating"]||"0",10);
    base.push({ title, author:(r["Author"]||"").trim(),
      isbn:String(r["ISBN13"]||r["ISBN"]||"").replace(/[^0-9Xx]/g,""),
      status, rating: mr>0?mr:null, pages:parseInt(r["Number of Pages"]||"0",10)||0,
      year:String(r["Year Published"]||"").slice(0,4), publisher:(r["Publisher"]||"").trim(),
      bookId:r["Book Id"]||title, dateRead:(r["Date Read"]||"").trim() });
    existing.add(normTitle(title));
  });
  if(!base.length){ alert("Nada novo pra importar (ou CSV vazio)."); return; }
  // enriquece com Google Books em blocos (de/para)
  const rowsOut=[]; const CH=8;
  for(let i=0;i<base.length;i+=CH){
    setImportStatus(`Buscando no Google Books… ${Math.min(i,base.length)}/${base.length}`);
    const enr=await Promise.all(base.slice(i,i+CH).map(async b=>{
      const gb=await gbLookup(b.isbn,b.title,b.author);
      const meta={authors:(gb&&gb.authors)||b.author, pages:(gb&&gb.pages)||b.pages, year:(gb&&gb.yr)||b.year, genre:(gb&&gb.genre)||"", publisher:(gb&&gb.publisher)||b.publisher, hours:0, started_at:null, starScale:true};
      const row={collection_id:ACTIVE, kind:"livro",
        ext_id: gb? gb.id : "gr:"+b.bookId,
        title: (gb&&gb.title)||b.title,
        poster: (gb&&gb.poster) || (b.isbn?`https://covers.openlibrary.org/b/isbn/${b.isbn}-M.jpg?default=false`:""),
        status:b.status, rating:b.rating, meta };
      if(b.status==="lido" && b.dateRead) row.done_date=b.dateRead.replace(/\//g,"-");
      return row;
    }));
    rowsOut.push(...enr);
  }
  setImportStatus(`Salvando ${rowsOut.length} livros…`);
  let ok=0;
  for(let i=0;i<rowsOut.length;i+=50){
    const {error}=await sb.from("items").insert(rowsOut.slice(i,i+50));
    if(error){ setImportStatus(""); alert("Erro no import: "+error.message); break; }
    ok+=rowsOut.slice(i,i+50).length;
  }
  setImportStatus("");
  alert(`Importados ${ok} livros do Goodreads, enriquecidos com o Google Books.${skip?` ${skip} já estavam na estante.`:""}`);
  await loadItems();
}

async function webCover(t,a){
  try{
    const r=await fetch(`https://www.googleapis.com/customsearch/v1?key=${CSEKEY}&cx=${CSE}&num=6&q=${encodeURIComponent(t+" "+a+" livro")}`);
    const d=await r.json();

      const pm=it.pagemap||{};
      const img=(pm.cse_image&&pm.cse_image[0]&&pm.cse_image[0].src) || (pm.metatags&&pm.metatags[0]&&pm.metatags[0]["og:image"]);
      const ttl=(pm.metatags&&pm.metatags[0]&&pm.metatags[0]["og:title"])||it.title||"";
      if(img && /^https?:/.test(img)) return {cover:img, title:ttl};
    }

  const {data,error}=await sb.from("collections").insert({kind:"livros",name,is_shared:shared}).select().single();
  if(error){alert("Erro: "+error.message);return;}
  closeModal(); ACTIVE=data.id; await loadCols(); if(shared) shareModal();
}
function shareModal(){
  const c=COLS.find(x=>x.id===ACTIVE);
  document.getElementById("modalbox").innerHTML=`<h3>Compartilhar "${esc(c.name)}"</h3>
    <label>E-mail da pessoa</label><input id="minv" type="email" placeholder="email@gmail.com">
    <div id="minvmsg" style="font-size:12px;color:var(--muted);min-height:16px;margin-bottom:8px"></div>
    <button class="btn" style="width:100%" onclick="doInvite()">Convidar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Fechar</button>`;
  document.getElementById("modal").style.display="flex";
}
async function doInvite(){
  const email=document.getElementById("minv").value.trim(); const m=document.getElementById("minvmsg");
  if(!email){m.textContent="Digite o e-mail.";return;}
  m.textContent="Convidando…";
  const {error}=await sb.rpc("invite_to_collection",{cid:ACTIVE,invite_email:email,invite_role:"editor"});
  m.style.color=error?"var(--neg)":"var(--pos)"; m.textContent=error?error.message:"Convite enviado! ✓";
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("click",e=>{ if(dd().style.display==="block" && !e.target.closest(".bar")) hideDropdown(); });

initAuth();
</script>
</body>
</html>
